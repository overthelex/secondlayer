name: 'Detect Monorepo Changes'
description: 'Detects which services changed since the last successful deploy'

inputs:
  baseline:
    description: 'Tag prefix to use as baseline: "ci-local" (default, for local CI) or "deploy-prod" (for prod deploy)'
    required: false
    default: 'ci-local'

outputs:
  shared:
    description: 'Whether packages/shared changed'
    value: ${{ steps.changes.outputs.shared }}
  backend:
    description: 'Whether mcp_backend changed'
    value: ${{ steps.changes.outputs.backend }}
  rada:
    description: 'Whether mcp_rada changed'
    value: ${{ steps.changes.outputs.rada }}
  openreyestr:
    description: 'Whether mcp_openreyestr changed'
    value: ${{ steps.changes.outputs.openreyestr }}
  frontend:
    description: 'Whether lexwebapp changed'
    value: ${{ steps.changes.outputs.frontend }}
  deployment:
    description: 'Whether deployment configs changed'
    value: ${{ steps.changes.outputs.deployment }}
  local_only:
    description: 'Whether only local-environment compose files changed (prod must not deploy)'
    value: ${{ steps.changes.outputs.local_only }}
  mobile:
    description: 'Whether mobile/ Flutter app changed'
    value: ${{ steps.changes.outputs.mobile }}
  platform:
    description: 'Whether platform/ developer console changed'
    value: ${{ steps.changes.outputs.platform }}
  opendata_sync:
    description: 'Whether opendata-sync scheduler changed'
    value: ${{ steps.changes.outputs.opendata_sync }}
  any_backend:
    description: 'Whether any backend service changed (shared/backend/rada/openreyestr)'
    value: ${{ steps.changes.outputs.any_backend }}
  services_to_build:
    description: 'JSON array of services that need rebuilding'
    value: ${{ steps.changes.outputs.services_to_build }}
  services_to_deploy:
    description: 'JSON array of Docker service names to deploy on prod'
    value: ${{ steps.changes.outputs.services_to_deploy }}
  monitoring:
    description: 'Whether monitoring configs changed (grafana, prometheus)'
    value: ${{ steps.changes.outputs.monitoring }}
  frontend_tests_needed:
    description: 'Whether frontend changes require running tests (false for static-only like public/)'
    value: ${{ steps.changes.outputs.frontend_tests_needed }}

runs:
  using: 'composite'
  steps:
    - name: Get last successful deploy commit
      id: last_deploy
      shell: bash
      run: |
        BASELINE="${{ inputs.baseline }}"
        LAST_SHA=""

        # Primary: use the requested baseline tag prefix
        LAST_TAG=$(git tag -l "${BASELINE}-*" --sort=-creatordate | head -1 || true)
        if [ -n "$LAST_TAG" ]; then
          LAST_SHA=$(git rev-parse "$LAST_TAG" 2>/dev/null || echo "")
          echo "Using ${BASELINE} marker tag: $LAST_TAG ($LAST_SHA)"
        fi

        # Fallback: try the other marker type
        if [ -z "$LAST_SHA" ]; then
          if [ "$BASELINE" = "ci-local" ]; then
            FALLBACK="deploy-prod"
          else
            FALLBACK="ci-local"
          fi
          LAST_TAG=$(git tag -l "${FALLBACK}-*" --sort=-creatordate | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            LAST_SHA=$(git rev-parse "$LAST_TAG" 2>/dev/null || echo "")
            echo "Using ${FALLBACK} marker tag as fallback: $LAST_TAG ($LAST_SHA)"
          fi
        fi

        # Fallback: release tags
        if [ -z "$LAST_SHA" ]; then
          LAST_TAG=$(git tag -l --sort=-creatordate "v*" "fe-v*" | head -1 || true)
          if [ -n "$LAST_TAG" ]; then
            LAST_SHA=$(git rev-parse "$LAST_TAG" 2>/dev/null || echo "")
            echo "Using release tag as fallback: $LAST_TAG ($LAST_SHA)"
          fi
        fi

        # Last resort: first parent of HEAD
        if [ -z "$LAST_SHA" ]; then
          LAST_SHA=$(git rev-parse HEAD~1)
          echo "WARNING: No deploy/release tags found, using HEAD~1 ($LAST_SHA)"
        fi

        echo "last_sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
        echo "Comparing changes since: $LAST_SHA"

    - name: Detect changed paths
      id: changes
      shell: bash
      run: |
        LAST_SHA="${{ steps.last_deploy.outputs.last_sha }}"
        CURRENT_SHA="${{ github.sha }}"

        # Get list of changed files
        CHANGED_FILES=$(git diff --name-only "$LAST_SHA" "$CURRENT_SHA" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
        echo "Changed files:"
        echo "$CHANGED_FILES"

        # Detect which components changed
        SHARED=false
        BACKEND=false
        RADA=false
        OPENREYESTR=false
        FRONTEND=false
        DEPLOYMENT=false
        MOBILE=false
        PLATFORM=false

        OPENDATA_SYNC=false
        FRONTEND_SRC=false  # true when lexwebapp src/tests/config changed (needs tests)

        DEPLOY_INFRA=false  # Dockerfiles, compose files, nginx — triggers full rebuild
        DEPLOY_MONITORING=false  # Grafana, prometheus — deploy-only, no rebuild
        LOCAL_ONLY=false  # только локальные compose-файлы — прод не трогаем

        while IFS= read -r file; do
          case "$file" in
            packages/shared/*) SHARED=true ;;
            mcp_backend/*) BACKEND=true ;;
            mcp_rada/*) RADA=true ;;
            mcp_openreyestr/*) OPENREYESTR=true ;;
            lexwebapp/public/*) FRONTEND=true ;;
            lexwebapp/*) FRONTEND=true; FRONTEND_SRC=true ;;
            # Локальные окружения на проде не используются, поэтому DEPLOY_INFRA
            # не ставим: иначе правка docker-compose.local.yml выкатывает прод.
            deployment/docker-compose.local.yml|deployment/docker-compose.dev-vm.yml|deployment/docker-compose.stage.yml) LOCAL_ONLY=true; DEPLOYMENT=true ;;
            deployment/grafana/*|deployment/prometheus/*) DEPLOY_MONITORING=true; DEPLOYMENT=true ;;
            deployment/*) DEPLOY_INFRA=true; DEPLOYMENT=true ;;
            mobile/*) MOBILE=true ;;
            platform/*) PLATFORM=true ;;
            opendata-sync/*) OPENDATA_SYNC=true ;;
          esac
        done <<< "$CHANGED_FILES"

        # If shared changed, ALL backend services need rebuild
        if [ "$SHARED" = "true" ]; then
          BACKEND=true
          RADA=true
          OPENREYESTR=true
        fi

        # If deployment infra changed (Dockerfiles, compose, nginx), rebuild backend services
        # Monitoring-only changes (grafana, prometheus) don't require service rebuilds
        # Platform is a static SPA — only rebuild when platform/ source actually changes
        if [ "$DEPLOY_INFRA" = "true" ]; then
          BACKEND=true
          RADA=true
          OPENREYESTR=true
          FRONTEND=true
        fi

        ANY_BACKEND=false
        if [ "$BACKEND" = "true" ] || [ "$RADA" = "true" ] || [ "$OPENREYESTR" = "true" ]; then
          ANY_BACKEND=true
        fi

        # Build services list (for Docker compose service names)
        SERVICES_TO_BUILD="[]"
        SERVICES_TO_DEPLOY="[]"
        BUILD_LIST=""
        DEPLOY_LIST=""

        if [ "$BACKEND" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"backend\","
          DEPLOY_LIST="${DEPLOY_LIST}\"app\",\"document-service\","
        fi
        if [ "$RADA" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"rada\","
          DEPLOY_LIST="${DEPLOY_LIST}\"rada-mcp-app\","
        fi
        if [ "$OPENREYESTR" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"openreyestr\","
          DEPLOY_LIST="${DEPLOY_LIST}\"app-openreyestr\","
        fi
        if [ "$FRONTEND" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"frontend\","
          DEPLOY_LIST="${DEPLOY_LIST}\"lexwebapp\","
        fi
        if [ "$PLATFORM" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"platform\","
          DEPLOY_LIST="${DEPLOY_LIST}\"platform\","
        fi
        if [ "$OPENDATA_SYNC" = "true" ]; then
          BUILD_LIST="${BUILD_LIST}\"opendata-sync\","
          DEPLOY_LIST="${DEPLOY_LIST}\"opendata-sync\","
        fi

        # Remove trailing comma and wrap in array
        BUILD_LIST="${BUILD_LIST%,}"
        DEPLOY_LIST="${DEPLOY_LIST%,}"
        SERVICES_TO_BUILD="[${BUILD_LIST}]"
        SERVICES_TO_DEPLOY="[${DEPLOY_LIST}]"

        # Frontend tests only needed when source code changed, not just static assets
        FRONTEND_TESTS_NEEDED=$FRONTEND_SRC
        if [ "$DEPLOY_INFRA" = "true" ]; then
          FRONTEND_TESTS_NEEDED=true
        fi

        echo "frontend_tests_needed=$FRONTEND_TESTS_NEEDED" >> "$GITHUB_OUTPUT"
        echo "shared=$SHARED" >> "$GITHUB_OUTPUT"
        echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
        echo "rada=$RADA" >> "$GITHUB_OUTPUT"
        echo "openreyestr=$OPENREYESTR" >> "$GITHUB_OUTPUT"
        echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
        echo "deployment=$DEPLOYMENT" >> "$GITHUB_OUTPUT"
        echo "local_only=$LOCAL_ONLY" >> "$GITHUB_OUTPUT"
        echo "monitoring=$DEPLOY_MONITORING" >> "$GITHUB_OUTPUT"
        echo "mobile=$MOBILE" >> "$GITHUB_OUTPUT"
        echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
        echo "opendata_sync=$OPENDATA_SYNC" >> "$GITHUB_OUTPUT"
        echo "any_backend=$ANY_BACKEND" >> "$GITHUB_OUTPUT"
        echo "services_to_build=$SERVICES_TO_BUILD" >> "$GITHUB_OUTPUT"
        echo "services_to_deploy=$SERVICES_TO_DEPLOY" >> "$GITHUB_OUTPUT"

        echo ""
        echo "=== Change Detection Summary ==="
        echo "  shared:      $SHARED"
        echo "  backend:     $BACKEND"
        echo "  rada:        $RADA"
        echo "  openreyestr: $OPENREYESTR"
        echo "  frontend:    $FRONTEND"
        echo "  deployment:  $DEPLOYMENT"
        echo "  local_only:  $LOCAL_ONLY"
        echo "  monitoring:  $DEPLOY_MONITORING"
        echo "  mobile:      $MOBILE"
        echo "  platform:    $PLATFORM"
        echo "  opendata_sync: $OPENDATA_SYNC"
        echo "  services_to_build: $SERVICES_TO_BUILD"
        echo "  services_to_deploy: $SERVICES_TO_DEPLOY"
