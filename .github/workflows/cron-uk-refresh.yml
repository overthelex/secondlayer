##############################################################################
# Weekly UK corpus refresh: research.legislation.gov.uk → lawrider_prod (GCP)
#
# Why this is a workflow and not just the crontab it replaces
# -----------------------------------------------------------
# `cron-edrsr-sync.yml` already records what happens when a data schedule fails
# quietly: it pointed at a runner label nothing carried any more, every run sat
# in the queue until GitHub cancelled it, "and nothing said so" — noticed only
# when the corpus turned out to hold zero decisions for September. The UK corpus
# had its own version of that: measured on 2026-09-18 it had not moved since
# 28 August, there was no UK entry in any crontab, and the register stopped at
# uksi/2026/933 while the source was publishing uksi/2026/1037.
#
# So the point here is not the schedule. It is that the schedule lives in git,
# that a failure is visible in the Actions tab, and above all that the run
# ASSERTS afterwards — scripts/uk/verify_uk_corpus.py fails the job if the corpus
# shrank, if an interval invariant broke, or if the register was not written at
# all, which is the shape of "the job ran and imported nothing".
#
# Why the work still happens on the box
# -------------------------------------
# A GitHub-hosted runner is the wrong executor for this and is used only as the
# scheduler and the place the log lands: the archives are 21 GB + 4.9 GB + 2.7 GB,
# the parse walks 186 GB, there is no route to the database from a hosted runner,
# and TNA rate-limits per IP — a shared runner address is a bad neighbour on a
# service that has already asked us to slow down.
#
# The scripts are copied from this checkout rather than run from the box's tree,
# so the run always executes the committed version even if no deploy has happened
# since the last change.
#
# ⚠ While this and the box's own crontab both exist, a double run is harmless:
# fetch skips an archive whose Last-Modified has not moved, stage 5 rewrites the
# same rows, and stage 6 skips every act whose version count is unchanged. Remove
# the crontab line once this has fired successfully at least once.
##############################################################################
name: 'Cron: UK corpus refresh'

on:
  schedule:
    # Mondays 04:00 UTC. The archives are rebuilt daily, so the day of the week
    # carries no meaning beyond keeping it off the CH pipeline's Sunday window.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Skip the refresh and only run the verification'
        required: false
        type: boolean
        default: false
      workers:
        description: 'Parser workers on the box (4 vCPU, it also serves lawrider.ch)'
        required: false
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: uk-refresh
  cancel-in-progress: false

env:
  GCP_USER: ubuntu
  STAGE_DIR: /home/ubuntu/uk-stage

jobs:
  refresh:
    name: Refresh and verify the UK corpus
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GCP_HOST: ${{ secrets.LAWRIDER_GCP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          if [ -z "$GCP_HOST" ]; then
            echo "::error::LAWRIDER_GCP_HOST secret is not set"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LAWRIDER_GCP_SSH_KEY }}" > ~/.ssh/gcp_deploy
          chmod 600 ~/.ssh/gcp_deploy
          # Pinned — see deployment/lawrider-gcp/known_hosts for why scanning
          # is not a weaker check but no check at all.
          cp deployment/lawrider-gcp/known_hosts ~/.ssh/known_hosts_uk
          echo "SSH_CMD=ssh -i $HOME/.ssh/gcp_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_uk -o ServerAliveInterval=30 ${GCP_USER}@${GCP_HOST}" >> "$GITHUB_ENV"

      - name: Ship this checkout's scripts to the box
        run: |
          $SSH_CMD "mkdir -p ${STAGE_DIR}"
          scp -i ~/.ssh/gcp_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts_uk -q scripts/uk/*.py scripts/uk/run-uk-refresh.sh \
            "${GCP_USER}@${GCP_HOST}:${STAGE_DIR}/"
          $SSH_CMD "chmod +x ${STAGE_DIR}/run-uk-refresh.sh"
          # Credentials and the DSN are provisioned on the box, in 0600 files outside
          # the repo tree so that `rsync --delete` on a deploy cannot remove them.
          $SSH_CMD "test -s /data/uk/research.env && test -s /data/uk/db.env" \
            || { echo "::error::/data/uk/research.env or /data/uk/db.env missing on the box"; exit 1; }

      - name: Refresh
        if: ${{ !inputs.verify_only }}
        env:
          # Through the environment, never interpolated straight into the shell line:
          # `${{ inputs.workers }}` inside a run: block is attacker-controlled text that
          # lands in a command executed on the production box.
          WORKERS_IN: ${{ inputs.workers }}
        run: |
          workers="${WORKERS_IN:-3}"
          case "$workers" in ''|*[!0-9]*) echo "::error::workers must be a whole number"; exit 1;; esac
          if [ "$workers" -lt 1 ] || [ "$workers" -gt 8 ]; then
            echo "::error::workers must be between 1 and 8 — the box has 4 vCPU and also serves lawrider.ch"
            exit 1
          fi
          $SSH_CMD "cd ${STAGE_DIR} && UK_WORKERS=$workers \
            UK_PYTHON=/home/ubuntu/uk-venv/bin/python3 \
            ./run-uk-refresh.sh 2>&1 | tee /data/uk/refresh-ci.log | tail -60"

      - name: Verify
        id: verify
        run: |
          $SSH_CMD "cd ${STAGE_DIR} && . /data/uk/db.env && export DATABASE_URL && \
            /home/ubuntu/uk-venv/bin/python3 verify_uk_corpus.py"

      - name: Refresh log on failure
        if: failure()
        run: |
          echo '--- last 100 lines of the refresh log ---'
          $SSH_CMD "tail -100 /data/uk/refresh-ci.log 2>/dev/null || echo '(no log — the refresh step did not get that far)'"
          echo '--- last recorded check runs ---'
          $SSH_CMD "docker exec pg-lawrider psql -U secondlayer -d secondlayer_prod -c \
            \"SELECT ran_at, ok, acts, acts_with_text, provisions, pit_rows FROM uk_corpus_check_run ORDER BY ran_at DESC LIMIT 5\"" || true
