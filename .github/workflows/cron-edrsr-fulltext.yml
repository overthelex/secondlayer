##############################################################################
# EDRSR Daily Fulltext Harvest: od.reyestr.court.gov.ua → legal.org.ua PostgreSQL
# - Companion to cron-edrsr-sync.yml, which imports METADATA only. Without this
#   job the texts drift: after the AWS box went away (03.09.2026) nothing fetched
#   them, and by 28.10 September and October sat at 0% text while every earlier
#   month was at 97-99%.
# - Runs on the cthulhu runner, 02:30 UTC — after the 01:00 UTC metadata sync,
#   so the documents it harvests are already in edrsr_documents.
# - Trailing window, not "yesterday": a decision's metadata and its text can
#   both land days late, and the harvester only fetches what is missing, so an
#   overlapping window is cheap and closes gaps the previous runs left. It also
#   absorbs the UTC/Kyiv boundary: adjudication_date is Kyiv midnight, so a
#   window that starts exactly on a day misses that day's documents.
# - One egress address (cthulhu's uplink) at 2 threads: measured 28.10 at
#   70-100 docs/s with zero overload pages over 1.59M documents. Above the
#   registry's limit it does not fail — it answers HTTP 200 with an overload
#   page, and the script aborts when that passes 10%.
##############################################################################
name: 'Cron: EDRSR Fulltext Harvest'

on:
  schedule:
    # 02:30 UTC = 04:30/05:30 Kyiv, after cron-edrsr-sync.yml (01:00 UTC)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'How many days back to harvest (default 10)'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: edrsr-fulltext
  cancel-in-progress: false

env:
  PG_CONTAINER: secondlayer-postgres-local
  PG_DB: secondlayer_local
  RTF_ROOT: /mnt/bulk_storage/edrsr-rtf

jobs:
  harvest:
    name: Harvest missing fulltexts
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prerequisites
        run: |
          # aiohttp/aiofiles live in the runner user's ~/.local; fail here, by name,
          # rather than with an ImportError halfway through the first batch.
          python3 -c "import aiohttp, aiofiles"
          docker exec "$PG_CONTAINER" pg_isready -U secondlayer -d "$PG_DB"
          mkdir -p "$RTF_ROOT/daily" "$RTF_ROOT/sweep"

      - name: Harvest (recent window)
        env:
          # Through env, never ${{ }} inside the script: this runs on a self-hosted box.
          DAYS_BACK: ${{ inputs.days_back || '10' }}
        run: |
          case "$DAYS_BACK" in ''|*[!0-9]*) echo "::error::days_back must be a number, got '$DAYS_BACK'"; exit 1;; esac
          # +1: adjudication_date is Kyiv midnight, i.e. 21:00/22:00 UTC the day
          # before, so a window starting exactly on day D would drop day D.
          FROM=$(date -u -d "-$((DAYS_BACK + 1)) days" +%Y-%m-%d)
          TO=$(date -u -d "+1 day" +%Y-%m-%d)
          echo "Harvesting $FROM .. $TO (exclusive)"
          # The egress address is discovered on bond0 and probed rather than
          # hardcoded: DHCP or a network move would otherwise leave a dead IP here.
          python3 scripts/edrsr/download-fulltext-prod.py \
            --from "$FROM" --to "$TO" --threads 2 --workers 8 \
            --container "$PG_CONTAINER" --db "$PG_DB" \
            --iface bond0 --allow-primary \
            --rtf-dir "$RTF_ROOT/daily"

      - name: Sweep the late-URL tail (Mondays)
        if: github.event_name == 'schedule'
        run: |
          # data.gov.ua publishes a decision first WITHOUT a doc_url and adds the link in
          # a later re-publication, so a document whose link arrives more than `days_back`
          # after its adjudication date falls out of the daily window and is never
          # harvested. A weekly pass over the last year closes that tail; it fetches only
          # what is missing, and 404s (the registry publishes the URL before the file)
          # fail fast instead of being retried.
          if [ "$(date -u +%u)" != "1" ]; then echo "not Monday — skipping the sweep"; exit 0; fi
          FROM=$(date -u -d "-1 year -1 day" +%Y-%m-%d)
          TO=$(date -u -d "+1 day" +%Y-%m-%d)
          echo "Sweeping $FROM .. $TO for documents whose URL arrived late"
          python3 scripts/edrsr/download-fulltext-prod.py \
            --from "$FROM" --to "$TO" --threads 2 --workers 8 \
            --container "$PG_CONTAINER" --db "$PG_DB" \
            --iface bond0 --allow-primary \
            --rtf-dir "$RTF_ROOT/sweep"

      - name: Coverage report
        if: always()
        run: |
          docker exec "$PG_CONTAINER" psql -U secondlayer -d "$PG_DB" -A -F'|' -c "
            SELECT (d.adjudication_date AT TIME ZONE 'Europe/Kyiv')::date AS day,
                   count(*) AS docs,
                   count(f.doc_id) AS with_text,
                   round(100.0 * count(f.doc_id) / count(*), 1) AS pct,
                   count(*) FILTER (WHERE f.doc_id IS NULL AND d.doc_url IS NOT NULL) AS missing_with_url
            FROM edrsr_documents d
            LEFT JOIN edrsr_fulltext f ON f.doc_id = d.doc_id
            WHERE d.adjudication_date >= ((now() AT TIME ZONE 'Europe/Kyiv')::date - 10)::timestamp AT TIME ZONE 'Europe/Kyiv'
              AND d.adjudication_date <  ((now() AT TIME ZONE 'Europe/Kyiv')::date + 1)::timestamp  AT TIME ZONE 'Europe/Kyiv'
            GROUP BY 1 ORDER BY 1;"

      - name: Prune harvested RTFs older than 3 days
        if: always()
        run: |
          # The RTFs are a download scratch area — the text lives in Postgres
          # once imported. Keeping them lets a re-run skip re-downloading, but
          # they accumulate at ~30GB per million documents.
          for d in "$RTF_ROOT/daily" "$RTF_ROOT/sweep"; do
            find "$d" -type f -mtime +3 -delete 2>/dev/null || true
            du -sh "$d" 2>/dev/null || true
          done
