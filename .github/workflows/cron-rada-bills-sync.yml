##############################################################################
# RADA bill cards: data.rada.gov.ua billinfo-skl9.json → rada.bills (legal.org.ua)
# - LEXAI-2099: rada.bills was only filled from billinfo_list (no status, stage
#   or url), so rada_search_parliament_bills returned NULL status/stage/url for
#   every bill, and nothing refreshed bill phases on a schedule.
# - Runs sync-bills.js inside the running rada container on cthulhu, which
#   already has the DB credentials. Upserts by bill_number, never deletes.
# - Daily: the full feed (~140 MB) is regenerated by RADA every evening.
##############################################################################
name: 'Cron: RADA bills sync'

on:
  schedule:
    # 03:10 UTC = 06:10 Kyiv (summer), after the voting sync
    - cron: '10 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'LIMIT: upsert only the first N bills (test run), empty = all'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rada-bills-sync
  cancel-in-progress: false

jobs:
  sync-bills:
    name: Sync RADA bills
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 30
    env:
      RADA_CONTAINER: rada-mcp-app-local
    steps:
      - name: Run sync
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if ! docker ps --format '{{.Names}}' | grep -qx "$RADA_CONTAINER"; then
            echo "::error::$RADA_CONTAINER is not running"
            exit 1
          fi
          args=(-e LOG_LEVEL=info)
          [ -n "${LIMIT:-}" ] && args+=(-e "LIMIT=$LIMIT")
          docker exec "${args[@]}" "$RADA_CONTAINER" \
            node --max-old-space-size=4096 dist/scripts/sync-bills.js
