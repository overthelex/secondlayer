##############################################################################
# Create the lawrider.uk box in London.
#
# The first workflow here that needs more than SSH. Every other lawrider job
# drives a machine that already exists — LAWRIDER_GCP_HOST and
# LAWRIDER_GCP_SSH_KEY are enough for that — but nothing in the repository could
# create one, which is why the London box would otherwise have been built by
# hand and remembered wrong.
#
# ⚠ Needs a secret the repository does not have yet: GCP_SA_KEY, the JSON key of
# a service account in project secondlayer-gpu with
#
#     roles/compute.instanceAdmin.v1     create the instance and reserve the IP
#     roles/compute.networkAdmin         attach the static address
#     roles/iam.serviceAccountUser       let the instance run as the default SA
#
# The job fails immediately and says so if the secret is missing, rather than
# authenticating as nothing and reporting a confusing permission error twenty
# lines later.
#
# Idempotent. The script reserves the address only if it is not reserved, creates
# the instance only if it does not exist, and the box setup is safe to repeat —
# so a re-run after a half-finished attempt is the normal way to recover.
#
# What it does NOT do, because these are secrets and DNS and belong to a person:
# deployment/.env.prod, the two 0600 files in /data/uk, the Cloudflare records,
# an origin certificate, and pointing LAWRIDER_GCP_HOST at the new address. The
# job prints all five at the end with the address filled in.
#
# Then: deploy-lawrider-uk.yml (builds the schema from MIGRATION_SET=uk) and
# migrate-uk-data.yml (moves the rows, verifies them against a manifest).
##############################################################################
name: 'Provision: lawrider.uk box (London)'

on:
  workflow_dispatch:
    inputs:
      zone:
        description: 'GCP zone'
        type: string
        default: 'europe-west2-a'
      machine_type:
        description: 'Machine type — 4 vCPU/16 GB carries 6.9 GB of corpus and 1.3M vectors'
        type: string
        default: 'e2-standard-4'
      disk_gb:
        description: 'Boot disk, GB'
        type: string
        default: '200'
      dry_run:
        description: 'Print what would be created, create nothing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-lawrider-uk
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Require the GCP credential
        env:
          SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::GCP_SA_KEY is not set. Create a service account in secondlayer-gpu with roles/compute.instanceAdmin.v1, roles/compute.networkAdmin and roles/iam.serviceAccountUser, then add its JSON key as the GCP_SA_KEY secret. See this workflow's header."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write the deploy key
        run: |
          # The same key the deploy and refresh jobs use. Passing it to the script
          # keeps `gcloud compute ssh` from pushing a throwaway key into project
          # metadata on every run.
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LAWRIDER_GCP_SSH_KEY }}" > ~/.ssh/gcp
          chmod 600 ~/.ssh/gcp

      - name: Provision
        env:
          GCP_PROJECT: secondlayer-gpu
          GCP_ZONE: ${{ inputs.zone }}
          VM_NAME: lawrider-uk
          VM_MACHINE: ${{ inputs.machine_type }}
          VM_DISK_GB: ${{ inputs.disk_gb }}
          PROVISION_SSH_KEY: /home/runner/.ssh/gcp
          # Through the environment, never interpolated into the script body: a
          # dispatch input is attacker-controlled text as far as the runner is
          # concerned, and this job holds a credential that can create machines.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          chmod +x deployment/lawrider-gcp/provision-uk-box.sh
          if [ "$DRY_RUN" = "true" ]; then
            deployment/lawrider-gcp/provision-uk-box.sh --dry-run
          else
            deployment/lawrider-gcp/provision-uk-box.sh
          fi

      - name: Show the box
        if: ${{ !inputs.dry_run }}
        env:
          ZONE: ${{ inputs.zone }}
        run: |
          gcloud compute instances describe lawrider-uk \
            --zone="$ZONE" --project=secondlayer-gpu \
            --format='table(name,status,machineType.basename(),networkInterfaces[0].accessConfigs[0].natIP)'
