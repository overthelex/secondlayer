##############################################################################
# UA registries refresh on cthulhu (legal.org.ua), LEXAI-2126.
# After the move off AWS nothing refreshed these; each job is idempotent
# (upsert / skip-if-loaded) and never deletes rows.
# - stenograms: data.rada.gov.ua /ogd/zal/agenda/skl9/{sten,text,spog}/*_txt.zip
#   → opendata_rada_stenograms (upsert on source_file), run in the app container
# - judges: data.gov.ua ВККС judges list → judges / judges_current
#   (--latest-only; snapshots already in judges_load_log are skipped)
# - spending: spending.gov.ua acts/addendums/peny, last 7 sign days
#   → spending_* (ON CONFLICT (id) DO NOTHING); LEXAI-2160 stopped at 25.03.2026
# - securities: data.gov.ua nssmc-001 holders/YYYY/Q (last 4 quarters)
#   → opendata_securities_owners (upsert), run in the app container
##############################################################################
name: 'Cron: UA registries refresh'

on:
  schedule:
    # 04:00 UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Run one job: stenograms | judges | vkks | securities | spending (empty = all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ua-registries-refresh
  cancel-in-progress: false

env:
  PG_ENV_FILE: /home/vovkes/SecondLayer/deployment/.env.local

jobs:
  stenograms:
    if: ${{ !inputs.only || inputs.only == 'stenograms' }}
    name: RADA stenograms
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 30
    steps:
      - name: Download and import skl9 archives
        run: |
          set -euo pipefail
          C=$(docker ps --format '{{.Names}}' | grep -E '^secondlayer-app-local(-blue|-green)?$' | head -1)
          [ -n "$C" ] || { echo "::error::no running secondlayer-app-local container"; exit 1; }
          R="$RUNNER_TEMP/rada_stenograms"
          rm -rf "$R"
          for f in sten/stenogram_txt.zip text/agenda_txt.zip spog/stenpog_txt.zip; do
            mkdir -p "$R/zal/agenda/skl9/$(dirname "$f")"
            curl -sf --retry 3 --max-time 600 -o "$R/zal/agenda/skl9/$f" \
              "https://data.rada.gov.ua/ogd/zal/agenda/skl9/$f"
          done
          docker exec "$C" rm -rf /tmp/rada_stenograms
          docker cp "$R" "$C:/tmp/rada_stenograms"
          docker exec "$C" node dist/scripts/import-rada-stenograms.js /tmp/rada_stenograms
          docker exec "$C" rm -rf /tmp/rada_stenograms
          rm -rf "$R"

  judges:
    if: ${{ !inputs.only || inputs.only == 'judges' }}
    name: VKKS judges
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/judges
      - name: Load latest snapshot
        run: |
          set -euo pipefail
          cd scripts/judges
          npm install --no-save --no-package-lock --silent pg@8.20.0 xlsx@0.18.5
          g() { grep -m1 "^$1=" "$PG_ENV_FILE" | cut -d= -f2- | tr -d "\"'"; }
          export POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432
          export POSTGRES_USER="$(g POSTGRES_USER)" POSTGRES_DB="$(g POSTGRES_DB)"
          export POSTGRES_PASSWORD="$(g POSTGRES_PASSWORD)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          node load-judges-vkks.js --latest-only --concurrency=2

  vkks:
    if: ${{ !inputs.only || inputs.only == 'vkks' }}
    name: VKKS registers (judges, vacancies, evaluations)
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 30
    steps:
      - name: Download newest XLSX and import
        run: |
          set -euo pipefail
          C=$(docker ps --format '{{.Names}}' | grep -E '^secondlayer-app-local(-blue|-green)?$' | head -1)
          [ -n "$C" ] || { echo "::error::no running secondlayer-app-local container"; exit 1; }
          D="$RUNNER_TEMP/vkks"
          rm -rf "$D"; mkdir -p "$D/evaluations"
          # newest resource of a dataset, or newest whose name matches a pattern
          pick() {
            curl -sf --retry 3 --max-time 120 "https://data.gov.ua/api/3/action/package_show?id=$1" \
              | python3 -c '
          import json, re, sys
          pat = re.compile(sys.argv[1], re.I)
          rs = [r for r in json.load(sys.stdin)["result"]["resources"]
                if pat.search(r.get("name") or "") and (r.get("format") or "").lower().find("xls") >= 0]
          rs.sort(key=lambda r: r.get("last_modified") or r.get("created") or "")
          print(rs[-1]["url"] if rs else "")
          ' "$2"
          }
          get() { [ -n "$1" ] || { echo "::error::no resource for $2"; exit 1; }; curl -sf --retry 3 --max-time 600 -o "$2" "$1"; }
          get "$(pick 9338e3fb-41a1-486d-a9b1-c49a0a4f7e4a .)" "$D/judges.xlsx"
          get "$(pick f37f5de5-8892-4525-808f-ff3a9475efe2 .)" "$D/vacancies.xlsx"
          EV=7fd5f184-eb9a-4837-9954-05d183b1d7df
          get "$(pick $EV 'первинн')" "$D/evaluations/primary.xlsx"
          get "$(pick $EV 'відповідність займан')" "$D/evaluations/regular.xlsx"
          u=$(pick $EV 'дисциплінарн'); [ -n "$u" ] && get "$u" "$D/evaluations/disciplinary.xlsx"
          ls -laR "$D"
          docker exec "$C" rm -rf /tmp/vkks
          docker cp "$D" "$C:/tmp/vkks"
          docker exec "$C" node dist/scripts/import-vkks-registers.js judges /tmp/vkks/judges.xlsx
          docker exec "$C" node dist/scripts/import-vkks-registers.js vacancies /tmp/vkks/vacancies.xlsx
          docker exec "$C" node dist/scripts/import-vkks-registers.js evaluations /tmp/vkks/evaluations
          docker exec "$C" rm -rf /tmp/vkks
          rm -rf "$D"

  securities:
    if: ${{ !inputs.only || inputs.only == 'securities' }}
    name: NKCPFR securities owners
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 30
    steps:
      - name: Download last 4 quarters and import
        run: |
          set -euo pipefail
          C=$(docker ps --format '{{.Names}}' | grep -E '^secondlayer-app-local(-blue|-green)?$' | head -1)
          [ -n "$C" ] || { echo "::error::no running secondlayer-app-local container"; exit 1; }
          D="$RUNNER_TEMP/nssmc_owners"
          rm -rf "$D"; mkdir -p "$D"
          curl -sf --retry 3 --max-time 120 'https://data.gov.ua/api/3/action/package_show?id=nssmc-001' \
            | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["result"]["resources"] if r["name"].startswith("holders/")]
          rs.sort(key=lambda r: r["name"])
          for r in rs[-4:]:
              print(r["name"].replace("/", "_") + ".csv", r["url"])
          ' | while read -r name url; do
            curl -sf --retry 3 --max-time 600 -o "$D/$name" "$url"
          done
          ls -la "$D"
          docker exec "$C" rm -rf /tmp/nssmc_owners
          docker cp "$D" "$C:/tmp/nssmc_owners"
          docker exec "$C" node dist/scripts/import-securities-owners-datagov.js /tmp/nssmc_owners
          docker exec "$C" rm -rf /tmp/nssmc_owners
          rm -rf "$D"

  spending:
    if: ${{ !inputs.only || inputs.only == 'spending' }}
    name: spending.gov.ua documents
    runs-on: [self-hosted, cthulhu]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/opendata/spending
      - name: Download last 7 days and import
        run: |
          set -euo pipefail
          cd scripts/opendata/spending
          D="$RUNNER_TEMP/spending"
          rm -rf "$D"; mkdir -p "$D"
          python3 download_spending.py --type all \
            --from "$(date -u -d '7 days ago' +%F)" --to "$(date -u +%F)" \
            --ips 0.0.0.0 --threads-per-ip 6 --output "$D"
          g() { grep -m1 "^$1=" "$PG_ENV_FILE" | cut -d= -f2- | tr -d "\"'"; }
          P="$(g POSTGRES_PASSWORD)"
          echo "::add-mask::$P"
          DATABASE_URL="postgresql://$(g POSTGRES_USER):$P@127.0.0.1:5432/$(g POSTGRES_DB)" \
            DATA_DIR="$D" python3 import_spending.py
          rm -rf "$D"
