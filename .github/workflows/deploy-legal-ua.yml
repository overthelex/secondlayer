##############################################################################
# Pipeline: Deploy legal.org.ua (local.lex prod)
#
# Two-prod topology (2026-08): the monorepo serves TWO products from one
# codebase, split by deploy target, not by fork:
#   - legal.org.ua  = local.lex prod (this workflow) -- the UA product,
#                     running in the local Docker environment on the same
#                     machine the runner lives on.
#   - lawrider.ch   = AWS prod (deploy-lawrider.yml) -- multi-jurisdiction,
#                     blue-green over SSH.
# Which jurisdictions a target serves is env-side (.env.local on the box),
# never a code fork.
#
# Before this workflow existed, "CI/CD: Local Build & Test" claimed to deploy
# the local environment but actually only built and tested -- deploys to
# local.lex were manual. This workflow is that missing deploy job, promoted
# to a first-class prod deploy now that local.lex serves real users.
#
# Design notes:
# - Deploys from a PERSISTENT clone (LEX_DEPLOY_REPO), never from the
#   runner's ephemeral workspace: deployment/.env.local is not in git, the
#   compose project must keep its name across runs, and the operator's own
#   working clone must never be touched by CI.
# - Migrations run via the migrate-local compose service. They are written
#   idempotent, so the safe order for a HEAVY migration (large scans, index
#   builds on live tables) is: apply it BY HAND in a window first, then let
#   this workflow's run be a no-op. Same rule as the AWS target.
# - nginx is force-recreated after any backend/frontend/deployment change:
#   its bind-mounted config goes stale otherwise (long-standing rule, see
#   CLAUDE.md "Nginx must be --force-recreated").
##############################################################################
name: 'Deploy legal.org.ua (local.lex)'

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (comma-separated: backend,rada,openreyestr,frontend,platform). Leave empty to auto-detect from changes since the last lex deploy.'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ["CI/CD: Local Build & Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: deploy-legal-ua
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, local]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      backend: ${{ steps.final.outputs.backend }}
      rada: ${{ steps.final.outputs.rada }}
      openreyestr: ${{ steps.final.outputs.openreyestr }}
      frontend: ${{ steps.final.outputs.frontend }}
      platform: ${{ steps.final.outputs.platform }}
      deployment: ${{ steps.final.outputs.deployment }}
      any_backend: ${{ steps.final.outputs.any_backend }}
      has_changes: ${{ steps.final.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes
        with:
          # deploy-lex-* marker tags are this target's own deploy history,
          # independent of the AWS target's deploy-prod-* tags: the two prods
          # deploy at different times, so neither may use the other's
          # baseline. First run falls back through ci-local/release tags.
          baseline: deploy-lex

      - name: Resolve final change flags
        id: final
        run: |
          INPUT_SERVICES="${{ github.event.inputs.services }}"

          if [ -n "$INPUT_SERVICES" ]; then
            echo "Using manual service selection: $INPUT_SERVICES"
            BACKEND=false RADA=false OPENREYESTR=false FRONTEND=false PLATFORM=false
            IFS=',' read -ra SVCS <<< "$INPUT_SERVICES"
            for svc in "${SVCS[@]}"; do
              svc=$(echo "$svc" | xargs)
              case "$svc" in
                backend) BACKEND=true ;;
                rada) RADA=true ;;
                openreyestr) OPENREYESTR=true ;;
                frontend) FRONTEND=true ;;
                platform) PLATFORM=true ;;
                *) echo "::warning::Unknown service: $svc" ;;
              esac
            done
            DEPLOYMENT=false
          else
            BACKEND='${{ steps.changes.outputs.backend }}'
            RADA='${{ steps.changes.outputs.rada }}'
            OPENREYESTR='${{ steps.changes.outputs.openreyestr }}'
            FRONTEND='${{ steps.changes.outputs.frontend }}'
            PLATFORM='${{ steps.changes.outputs.platform }}'
            DEPLOYMENT='${{ steps.changes.outputs.deployment }}'
          fi

          ANY_BACKEND=false
          if [ "$BACKEND" = "true" ] || [ "$RADA" = "true" ] || [ "$OPENREYESTR" = "true" ]; then
            ANY_BACKEND=true
          fi

          HAS_CHANGES=false
          if [ "$ANY_BACKEND" = "true" ] || [ "$FRONTEND" = "true" ] || [ "$PLATFORM" = "true" ] || [ "$DEPLOYMENT" = "true" ]; then
            HAS_CHANGES=true
          fi

          {
            echo "backend=$BACKEND"
            echo "rada=$RADA"
            echo "openreyestr=$OPENREYESTR"
            echo "frontend=$FRONTEND"
            echo "platform=$PLATFORM"
            echo "deployment=$DEPLOYMENT"
            echo "any_backend=$ANY_BACKEND"
            echo "has_changes=$HAS_CHANGES"
          } >> "$GITHUB_OUTPUT"
          [ "$HAS_CHANGES" = "true" ] || echo "Nothing changed for local.lex — skipping deploy"

  # ─── Step 2: Deploy to the local.lex environment ─────────────────────
  deploy:
    name: Deploy to local.lex
    runs-on: [self-hosted, local]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      # Persistent deploy clone on local.lex. Seed once by hand:
      #   git clone <repo> "$LEX_DEPLOY_REPO"
      #   cp <secrets> "$LEX_DEPLOY_REPO/deployment/.env.local"
      LEX_DEPLOY_REPO: ${{ vars.LEX_DEPLOY_REPO || '/home/runner/secondlayer-deploy' }}
      # The commit the CI run that triggered us actually tested — never
      # whatever main has moved to since.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.platform }}
      DEPLOYMENT_CHANGED: ${{ needs.detect-changes.outputs.deployment }}
      ANY_BACKEND: ${{ needs.detect-changes.outputs.any_backend }}
    steps:
      - name: Sync the persistent deploy clone
        run: |
          if [ ! -d "$LEX_DEPLOY_REPO/.git" ]; then
            echo "Cloning fresh deploy repo into $LEX_DEPLOY_REPO"
            git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$LEX_DEPLOY_REPO"
          fi
          cd "$LEX_DEPLOY_REPO"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin
          git checkout --force "$DEPLOY_SHA"
          # No `git clean`: node_modules, dist and the core overlay are
          # untracked on purpose and expensive to rebuild; checkout --force
          # already resets every tracked file to the deployed SHA, and
          # deployment/.env.local must survive across runs.
          echo "Deploying $(git log --oneline -1)"

      - name: Guard — env file must exist
        run: |
          if [ ! -s "$LEX_DEPLOY_REPO/deployment/.env.local" ]; then
            echo "::error::$LEX_DEPLOY_REPO/deployment/.env.local is missing. Compose files have no env_file directives — secrets are injected via --env-file, and this file is seeded by the operator, not by CI."
            exit 1
          fi

      - name: Overlay proprietary source
        if: env.BACKEND_CHANGED == 'true'
        env:
          CORE_REPO_SSH_KEY: ${{ secrets.CORE_REPO_SSH_KEY }}
        run: |
          CORE_TMP=$(mktemp -d)
          KEY_FILE=$(mktemp)
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"; rm -rf "$CORE_TMP"' EXIT
          printf '%s\n' "$CORE_REPO_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:overthelex/secondlayer-core.git "$CORE_TMP"
          test -s "$CORE_TMP/src/services/chat-execution-loop.ts" && test -s "$CORE_TMP/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core clone incomplete"; exit 1; }
          find "$CORE_TMP"/src/services -maxdepth 1 -name '*.ts' -exec cp -f {} "$LEX_DEPLOY_REPO"/mcp_backend/src/services/ \;
          cp -rf "$CORE_TMP"/src/prompts/* "$LEX_DEPLOY_REPO"/mcp_backend/src/prompts/
          test -s "$LEX_DEPLOY_REPO/mcp_backend/src/services/chat-execution-loop.ts" \
            || { echo "::error::core overlay failed"; exit 1; }

      # docker-compose.local.yml bind-mounts packages/shared/dist and
      # mcp_backend/dist from the host, so the containers run what is built
      # HERE, not what the Dockerfile builds.
      - name: Build shared + backend dists
        if: env.ANY_BACKEND == 'true'
        run: |
          cd "$LEX_DEPLOY_REPO"
          sudo chown -R "$(id -u):$(id -g)" packages/shared/dist mcp_backend/dist 2>/dev/null || true
          cd packages/shared && npm install --legacy-peer-deps && npm run build
          if [ "$BACKEND_CHANGED" = "true" ]; then
            cd ../../mcp_backend && npm install && npm run build
          fi

      - name: Build & start changed services
        run: |
          cd "$LEX_DEPLOY_REPO/deployment"
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"

          BUILD=""
          UP=""
          [ "$BACKEND_CHANGED" = "true" ]     && BUILD="$BUILD app-local document-service-local migrate-local" \
                                              && UP="$UP app-local document-service-local"
          [ "$RADA_CHANGED" = "true" ]        && BUILD="$BUILD rada-mcp-app-local rada-migrate-local" \
                                              && UP="$UP rada-mcp-app-local"
          [ "$OPENREYESTR_CHANGED" = "true" ] && BUILD="$BUILD app-openreyestr-local migrate-openreyestr-local" \
                                              && UP="$UP app-openreyestr-local"
          [ "$FRONTEND_CHANGED" = "true" ]    && BUILD="$BUILD lexwebapp-local" && UP="$UP lexwebapp-local"
          [ "$PLATFORM_CHANGED" = "true" ]    && BUILD="$BUILD platform-local"  && UP="$UP platform-local"

          if [ -n "$BUILD" ]; then
            echo "Building:$BUILD"
            $DC build $BUILD
          fi

          # Migrations before the apps they gate. Idempotent by convention;
          # heavy ones are applied by hand in a window FIRST (see header).
          [ "$BACKEND_CHANGED" = "true" ]     && { $DC up migrate-local || true; }
          [ "$RADA_CHANGED" = "true" ]        && { $DC up rada-migrate-local || true; }
          [ "$OPENREYESTR_CHANGED" = "true" ] && { $DC up migrate-openreyestr-local || true; }

          if [ -n "$UP" ]; then
            echo "Starting:$UP"
            $DC up -d $UP
          fi

          # Stale bind-mounted config otherwise — the rule that has bitten
          # this repo enough times to be in CLAUDE.md.
          if [ "$ANY_BACKEND" = "true" ] || [ "$FRONTEND_CHANGED" = "true" ] || [ "$DEPLOYMENT_CHANGED" = "true" ]; then
            $DC up -d --force-recreate nginx-local
          fi

      - name: Health check
        run: |
          cd "$LEX_DEPLOY_REPO/deployment"
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"

          if [ "$BACKEND_CHANGED" = "true" ]; then
            OK=false
            for i in $(seq 1 24); do
              if curl -fsS --max-time 5 http://127.0.0.1:3000/health >/dev/null 2>&1; then
                OK=true; break
              fi
              sleep 5
            done
            if [ "$OK" != "true" ]; then
              echo "::error::backend health check failed after 120s"
              $DC ps
              $DC logs --tail 80 app-local || true
              exit 1
            fi
            echo "backend healthy"
          fi

          # Whatever was (re)started must actually be running.
          DEAD=$($DC ps --status exited --format '{{.Name}}' | grep -v -E 'migrate|db-init|seed|deps' || true)
          if [ -n "$DEAD" ]; then
            echo "::error::containers exited unexpectedly: $DEAD"
            for c in $DEAD; do docker logs --tail 40 "$c" || true; done
            exit 1
          fi
          $DC ps

      - name: Tag deploy marker
        run: |
          cd "$LEX_DEPLOY_REPO"
          DEPLOY_TAG="deploy-lex-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$DEPLOY_TAG" "$DEPLOY_SHA"
          git push origin "$DEPLOY_TAG"
          echo "Created deploy marker tag: $DEPLOY_TAG"
