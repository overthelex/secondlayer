##############################################################################
# Pipeline: Local CI/CD
# - Runs on self-hosted runner (local.legal.org.ua)
# - Builds and tests all changed services in local Docker environment
# - Deploys changed services to local environment for integration testing
# - Triggered on merge to main
##############################################################################
name: 'CI/CD: Local Build & Test'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Развернуть локальное окружение (docker compose up на cthulhu)'
        type: boolean
        default: true
      no_cache:
        description: 'Полная пересборка образов (--no-cache)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-local-build-test
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, local]
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      backend: ${{ steps.changes.outputs.backend }}
      rada: ${{ steps.changes.outputs.rada }}
      openreyestr: ${{ steps.changes.outputs.openreyestr }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      any_backend: ${{ steps.changes.outputs.any_backend }}
      services_to_build: ${{ steps.changes.outputs.services_to_build }}
      services_to_deploy: ${{ steps.changes.outputs.services_to_deploy }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      platform: ${{ steps.changes.outputs.platform }}
      frontend_tests_needed: ${{ steps.changes.outputs.frontend_tests_needed }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Check if any services need deploy
        id: check
        run: |
          SERVICES='${{ steps.changes.outputs.services_to_build }}'
          MONITORING='${{ steps.changes.outputs.monitoring }}'
          if [ "$SERVICES" = '[]' ] && [ "$MONITORING" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No services changed — skipping build/test/deploy"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Step 2: Build & test on local environment ─────────────────────
  build-and-test:
    name: Build & Test on Local
    runs-on: [self-hosted, local-build]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        run: |
          if ! command -v make &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Self-hosted runner: deployment/docker-compose.local.yml bind-mounts
      # packages/shared/dist and mcp_backend/dist into containers. When those host
      # dirs are absent, the Docker daemon (root) creates them root-owned, which
      # then blocks the next tsc build under the runner user (EACCES). Reset first.
      - name: Reset dist ownership (self-hosted runner)
        run: sudo chown -R "$(id -u):$(id -g)" packages/shared/dist mcp_backend/dist 2>/dev/null || true

      - name: Build shared package
        run: cd packages/shared && npm install --legacy-peer-deps && npm run build

      # Backend/RADA/OpenReyestr integration tests require running infrastructure (DB, Redis, MinIO).
      # CI runs TypeScript compilation + unit tests (mocked, no infra needed).
      - name: Overlay proprietary source
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          CORE_REPO_SSH_KEY: ${{ secrets.CORE_REPO_SSH_KEY }}
        run: |
          CORE_TMP=$(mktemp -d)
          KEY_FILE=$(mktemp)
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"; rm -rf "$CORE_TMP"' EXIT
          printf '%s\n' "$CORE_REPO_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:overthelex/secondlayer-core.git "$CORE_TMP"
          test -s "$CORE_TMP/src/services/chat-execution-loop.ts" && test -s "$CORE_TMP/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core clone incomplete — key files missing in $CORE_TMP"; exit 1; }
          find "$CORE_TMP"/src/services -maxdepth 1 -name '*.ts' -exec cp -f {} mcp_backend/src/services/ \;
          cp -rf "$CORE_TMP"/src/prompts/* mcp_backend/src/prompts/
          test -s mcp_backend/src/services/chat-execution-loop.ts && test -s mcp_backend/src/prompts/chat-system-prompt.ts \
            || { echo "::error::core overlay failed — key files missing after copy"; exit 1; }

      - name: Build backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npm install && npm run build

      - name: Unit test backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npx jest --no-cache --forceExit \
            src/controllers/__tests__/ \
            src/middleware/__tests__/ \
            src/adapters/__tests__/ \
            src/services/__tests__/

      - name: Build RADA
        if: needs.detect-changes.outputs.rada == 'true'
        run: cd mcp_rada && npm install && npm run build

      - name: Build OpenReyestr
        if: needs.detect-changes.outputs.openreyestr == 'true'
        run: cd mcp_openreyestr && npm install && npm run build

      - name: Install frontend deps
        if: needs.detect-changes.outputs.frontend == 'true'
        run: cd lexwebapp && npm install --legacy-peer-deps

      - name: Test frontend
        if: needs.detect-changes.outputs.frontend_tests_needed == 'true'
        timeout-minutes: 5
        run: |
          cd lexwebapp
          # Run vitest with timeout — it often hangs on teardown after tests complete
          timeout 60 npx vitest run --reporter=verbose 2>&1 | tee /tmp/vitest-output.txt || true
          # Determine results: check for explicit failures first, then for any passed tests
          if grep -qE "FAIL\s|Tests.*failed|×|✗" /tmp/vitest-output.txt; then
            echo "::error::Some tests failed"
            cat /tmp/vitest-output.txt | grep -E "FAIL|×|✗" | head -20
            exit 1
          elif grep -qE "Test Files.*passed|✓.*test" /tmp/vitest-output.txt; then
            PASSED=$(grep -c "✓" /tmp/vitest-output.txt || echo "0")
            echo "All tests passed ($PASSED test suites). Vitest may have hung on teardown — that's OK."
          else
            echo "::error::Could not determine test results — no pass/fail markers found"
            tail -30 /tmp/vitest-output.txt
            exit 1
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: cd lexwebapp && npm run build
        env:
          VITE_API_URL: https://local.legal.org.ua
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build platform
        if: needs.detect-changes.outputs.platform == 'true'
        run: cd platform && npm install --legacy-peer-deps && npm run build

  # ─── Step 2b: Self-heal build failures with Claude Code (DISABLED) ──
  self-heal-build:
    name: Self-Heal Build Failures
    runs-on: [self-hosted, local]
    needs: [detect-changes, build-and-test]
    if: false  # temporarily disabled — not producing useful fixes
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      CLAUDE_CODE_BEDROCK_MODEL: eu.anthropic.claude-sonnet-4-6
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard against infinite loops
        id: guard
        run: |
          # Check last 5 commits for autofix pattern (not just the last one)
          AUTOFIX_COUNT=$(git log -5 --format='%s' | grep -c '\[ci-autofix\]' || true)
          if [ "$AUTOFIX_COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $AUTOFIX_COUNT autofix commit(s) in last 5 — skipping to prevent loop"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch build error logs
        if: steps.guard.outputs.skip == 'false'
        id: errors
        run: |
          RUN_ID="${{ github.run_id }}"
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -100 > /tmp/ci-errors.log
          echo "Captured $(wc -l < /tmp/ci-errors.log) lines of error logs"

      - name: Claude Code — diagnose and fix
        if: steps.guard.outputs.skip == 'false'
        id: claude-fix
        continue-on-error: true
        run: |
          BRANCH_NAME="ci-autofix/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          git checkout -b "$BRANCH_NAME"

          cat > /tmp/ci-prompt.txt <<'PROMPT_END'
          The CI/CD build-and-test job failed. The error logs are in /tmp/ci-errors.log — read that file first.

          Your task:
          1. Read /tmp/ci-errors.log to understand the failure
          2. Determine if this is a build error (TypeScript compilation) or a test failure
          3. Analyze the errors and identify the root cause
          4. Fix the code — edit the minimal set of files needed
          5. If it's a test failure:
             - Read the failing test file AND the source file it tests
             - Determine if the test is wrong (outdated assertions) or the source code has a bug
             - Fix whichever is actually incorrect
             - Run the specific test to verify: npx jest --no-cache <test-file> --forceExit
          6. If it's a build error:
             - Fix the TypeScript errors
             - Run npm run build in the affected service to verify
          7. Stage ONLY the files you changed and commit with message: "fix: [ci-autofix] <description>"
          8. Do NOT push — the pipeline will handle pushing and PR creation

          Rules:
          - Do NOT blindly change test expectations — understand WHY the test fails first
          - Do NOT modify CI workflow files
          - Do NOT install new dependencies unless absolutely necessary
          - Do NOT run git push
          - If the error is in environment config (missing env vars, wrong URLs), skip — it's not a code fix
          - If you cannot fix the issue, create a GitHub issue describing the problem
          PROMPT_END

          npx -y @anthropic-ai/claude-code@latest \
            -p "$(cat /tmp/ci-prompt.txt)" \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --max-turns 25
        timeout-minutes: 10

      - name: Check if fix was produced
        if: steps.guard.outputs.skip == 'false'
        id: check-fix
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if git log --oneline "main..$CURRENT_BRANCH" 2>/dev/null | grep -q .; then
            echo "has_fix=true" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "has_fix=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude Code did not produce a fix"
          fi

      - name: Create issue if no fix produced
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "CI build failure needs manual fix ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## CI build failure — auto-fix failed

          The self-heal agent could not produce a code fix for this build failure.

          **Failed run:** $RUN_URL
          **Commit:** ${GITHUB_SHA:0:7}

          Please investigate manually.
          EOF
          )" \
            --label "bug,ci"

      - name: Push branch and create PR
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="${{ steps.check-fix.outputs.branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "fix: [ci-autofix] Auto-fix for build failure" \
            --body "$(cat <<EOF
          ## Auto-generated fix

          Claude Code analyzed the CI build failure and produced this fix automatically.

          **Source run:** $RUN_URL

          > Review carefully before merging — this is an automated fix.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"

  # ─── Step 4: Deploy to the local environment ─────────────────────────
  # Разворачивает стек на cthulhu (local.lex) тем же compose-файлом, что и
  # ручной `manage-gateway.sh deploy local`, но под контролем пайплайна.
  deploy-local:
    name: Deploy Local Environment
    # ВАЖНО: пин на `local-deploy` — единственный лейбл, уникальный для cthulhu.
    # Лейбл `local` матчится и на prod-runner, и джоба уехала бы разворачивать
    # локальный стек прямо на проде (см. deploy-preview note в deploy-prod.yml).
    runs-on: [self-hosted, local-deploy]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result != 'failure' &&
      needs.build-and-test.result != 'cancelled' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true')
      )
    timeout-minutes: 120
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          REPO="$HOME/SecondLayer"
          if [ ! -d "$REPO/.git" ]; then
            echo "::error::$REPO не является git-репозиторием — деплой-чекаут не найден"
            exit 1
          fi
          cd "$REPO"
          git fetch --prune origin
          git checkout main
          git reset --hard "${{ github.sha }}"
          echo "Развёрнутый коммит: $(git log --oneline -1)"

      - name: Verify local env file
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/SecondLayer/deployment/.env.local"
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE отсутствует или пуст (секреты не в git — файл живёт на машине)"
            exit 1
          fi
          echo "Переменных в .env.local: $(grep -cE '^[A-Z_]+=' "$ENV_FILE")"

      - name: Overlay proprietary source
        env:
          CORE_REPO_SSH_KEY: ${{ secrets.CORE_REPO_SSH_KEY }}
        run: |
          set -euo pipefail
          REPO="$HOME/SecondLayer"
          CORE_TMP=$(mktemp -d)
          KEY_FILE=$(mktemp)
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"; rm -rf "$CORE_TMP"' EXIT
          printf '%s\n' "$CORE_REPO_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:overthelex/secondlayer-core.git "$CORE_TMP"
          test -s "$CORE_TMP/src/services/chat-execution-loop.ts" && test -s "$CORE_TMP/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core clone incomplete — key files missing in $CORE_TMP"; exit 1; }
          find "$CORE_TMP"/src/services -maxdepth 1 -name '*.ts' -exec cp -f {} "$REPO/mcp_backend/src/services/" \;
          cp -rf "$CORE_TMP"/src/prompts/* "$REPO/mcp_backend/src/prompts/"
          test -s "$REPO/mcp_backend/src/services/chat-execution-loop.ts" && test -s "$REPO/mcp_backend/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core overlay failed — key files missing after copy"; exit 1; }
          echo "Оверлей на месте: $(find "$REPO/mcp_backend/src/services" -maxdepth 1 -name '*.ts' | wc -l) файлов в services"

      - name: Deploy stack
        run: |
          set -euo pipefail
          cd "$HOME/SecondLayer/deployment"
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            $DC build --no-cache
          fi
          # без --remove-orphans: рядом на этой же машине крутятся qdrant-edrsr-local
          # и qdrant-general-local, которые обслуживают ПРОД
          $DC up -d --build
          $DC ps

      - name: Wait for backend health
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec secondlayer-app-local wget -q -O /dev/null --timeout=5 http://127.0.0.1:3000/health 2>/dev/null; then
              echo "✓ backend отвечает на :3000/health"
              exit 0
            fi
            echo "  жду бэкенд... ($i/30)"
            sleep 10
          done
          echo "::error::backend не поднялся за 5 минут"
          docker logs --tail 80 secondlayer-app-local || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Локальное окружение развёрнуто"
            echo ""
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- URL: https://local.legal.org.ua"
            echo ""
            echo '```'
            cd "$HOME/SecondLayer/deployment"
            docker compose -f docker-compose.local.yml --env-file .env.local ps --format '{{.Name}}\t{{.Status}}' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
