##############################################################################
# Pipeline: CI + deploy legal.org.ua (local.lex prod)
#
# Two-prod topology (2026-08): one codebase, two products, split by deploy
# target and env, never by fork:
#   - legal.org.ua = the local environment on cthulhu (local.lex), deployed
#     by THIS workflow's deploy-local job after build-and-test succeeds.
#     Now that the box serves real users, that deploy IS a prod deploy.
#   - lawrider.ch  = AWS (deploy-lawrider.yml), blue-green over SSH,
#     triggered by this workflow's success via workflow_run.
# Which jurisdictions a target serves is env-side (.env.local / .env.prod).
#
# - Runs on self-hosted runners; deploy-local pins the `local-deploy` label
#   (unique to cthulhu — `local` alone also matches the prod runner).
# - Triggered on merge to main, or manually (deploy/no_cache inputs)
##############################################################################
name: 'CI/CD: Local Build & Test'

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Развернуть локальное окружение (docker compose up на cthulhu)'
        type: boolean
        default: true
      no_cache:
        description: 'Полная пересборка образов (--no-cache)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-local-build-test
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    # `local` матчится и на prod-runner — весь конвейер нового прода держим
    # на его собственной машине
    runs-on: [self-hosted, local-deploy]
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      backend: ${{ steps.changes.outputs.backend }}
      rada: ${{ steps.changes.outputs.rada }}
      openreyestr: ${{ steps.changes.outputs.openreyestr }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      local_only: ${{ steps.changes.outputs.local_only }}
      any_backend: ${{ steps.changes.outputs.any_backend }}
      services_to_build: ${{ steps.changes.outputs.services_to_build }}
      services_to_deploy: ${{ steps.changes.outputs.services_to_deploy }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      platform: ${{ steps.changes.outputs.platform }}
      frontend_tests_needed: ${{ steps.changes.outputs.frontend_tests_needed }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Check if any services need deploy
        id: check
        run: |
          SERVICES='${{ steps.changes.outputs.services_to_build }}'
          MONITORING='${{ steps.changes.outputs.monitoring }}'
          LOCAL_ONLY='${{ steps.changes.outputs.local_only }}'
          # local_only — правка docker-compose.local.yml: прод её игнорирует
          # (см. detect-changes), а локальное окружение обязано передеплоиться
          if [ "$SERVICES" = '[]' ] && [ "$MONITORING" != "true" ] && [ "$LOCAL_ONLY" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No services changed — skipping build/test/deploy"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Step 2: Build & test on local environment ─────────────────────
  build-and-test:
    name: Build & Test on Local
    # Пин на cthulhu-vm — виртуалку на local.lex. Лейбл `local-build` до
    # 26.08 висел ещё и на prod-runner, поэтому сборка нового прода регулярно
    # уезжала собираться на старом: кто из двух раннеров освободился первым,
    # тот её и брал. Лишний лейбл с prod-runner снят, но пин оставляем в коде —
    # чтобы возврат лейбла не вернул лотерею.
    # Та же ловушка, что была у deploy-local с лейблом `local`.
    runs-on: [self-hosted, cthulhu-vm]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        run: |
          if ! command -v make &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Self-hosted runner: deployment/docker-compose.local.yml bind-mounts
      # packages/shared/dist and mcp_backend/dist into containers. When those host
      # dirs are absent, the Docker daemon (root) creates them root-owned, which
      # then blocks the next tsc build under the runner user (EACCES). Reset first.
      - name: Reset dist ownership (self-hosted runner)
        run: sudo chown -R "$(id -u):$(id -g)" packages/shared/dist mcp_backend/dist 2>/dev/null || true

      # Одна установка на весь монорепозиторий. `package.json` в корне объявляет
      # рабочие области (mcp_backend, mcp_rada, mcp_openreyestr, lexwebapp,
      # packages/shared), поэтому npm из каталога пакета всё равно уходит в
      # корень — шесть прежних `npm install` шесть раз ставили одно и то же.
      # `ci` вместо `install`: ставится ровно то, что записано в lock-файле.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build shared package
        run: cd packages/shared && npm run build

      # Backend/RADA/OpenReyestr integration tests require running infrastructure (DB, Redis, MinIO).
      # CI runs TypeScript compilation + unit tests (mocked, no infra needed).
      - name: Overlay proprietary source
        if: needs.detect-changes.outputs.backend == 'true'
        env:
          CORE_REPO_SSH_KEY: ${{ secrets.CORE_REPO_SSH_KEY }}
        run: |
          CORE_TMP=$(mktemp -d)
          KEY_FILE=$(mktemp)
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"; rm -rf "$CORE_TMP"' EXIT
          printf '%s\n' "$CORE_REPO_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:overthelex/secondlayer-core.git "$CORE_TMP"
          test -s "$CORE_TMP/src/services/chat-execution-loop.ts" && test -s "$CORE_TMP/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core clone incomplete — key files missing in $CORE_TMP"; exit 1; }
          find "$CORE_TMP"/src/services -maxdepth 1 -name '*.ts' -exec cp -f {} mcp_backend/src/services/ \;
          cp -rf "$CORE_TMP"/src/prompts/* mcp_backend/src/prompts/
          test -s mcp_backend/src/services/chat-execution-loop.ts && test -s mcp_backend/src/prompts/chat-system-prompt.ts \
            || { echo "::error::core overlay failed — key files missing after copy"; exit 1; }

      - name: Build backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npm run build

      - name: Unit test backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npx jest --no-cache --forceExit \
            src/controllers/__tests__/ \
            src/middleware/__tests__/ \
            src/adapters/__tests__/ \
            src/services/__tests__/

      - name: Build RADA
        if: needs.detect-changes.outputs.rada == 'true'
        run: cd mcp_rada && npm run build

      - name: Build OpenReyestr
        if: needs.detect-changes.outputs.openreyestr == 'true'
        run: cd mcp_openreyestr && npm run build

      - name: Test frontend
        if: needs.detect-changes.outputs.frontend_tests_needed == 'true'
        timeout-minutes: 5
        run: |
          cd lexwebapp
          # Run vitest with timeout — it often hangs on teardown after tests complete
          timeout 60 npx vitest run --reporter=verbose 2>&1 | tee /tmp/vitest-output.txt || true
          # Determine results: check for explicit failures first, then for any passed tests
          if grep -qE "FAIL\s|Tests.*failed|×|✗" /tmp/vitest-output.txt; then
            echo "::error::Some tests failed"
            cat /tmp/vitest-output.txt | grep -E "FAIL|×|✗" | head -20
            exit 1
          elif grep -qE "Test Files.*passed|✓.*test" /tmp/vitest-output.txt; then
            PASSED=$(grep -c "✓" /tmp/vitest-output.txt || echo "0")
            echo "All tests passed ($PASSED test suites). Vitest may have hung on teardown — that's OK."
          else
            echo "::error::Could not determine test results — no pass/fail markers found"
            tail -30 /tmp/vitest-output.txt
            exit 1
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: cd lexwebapp && npm run build
        env:
          VITE_API_URL: https://local.legal.org.ua
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build platform
        if: needs.detect-changes.outputs.platform == 'true'
        run: cd platform && npm ci --legacy-peer-deps --no-audit --no-fund && npm run build

  # ─── Step 2b: Self-heal build failures with Claude Code (DISABLED) ──
  self-heal-build:
    name: Self-Heal Build Failures
    runs-on: [self-hosted, local-deploy]
    needs: [detect-changes, build-and-test]
    if: false  # temporarily disabled — not producing useful fixes
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      CLAUDE_CODE_BEDROCK_MODEL: eu.anthropic.claude-sonnet-4-6
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Guard against infinite loops
        id: guard
        run: |
          # Check last 5 commits for autofix pattern (not just the last one)
          AUTOFIX_COUNT=$(git log -5 --format='%s' | grep -c '\[ci-autofix\]' || true)
          if [ "$AUTOFIX_COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $AUTOFIX_COUNT autofix commit(s) in last 5 — skipping to prevent loop"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch build error logs
        if: steps.guard.outputs.skip == 'false'
        id: errors
        run: |
          RUN_ID="${{ github.run_id }}"
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -100 > /tmp/ci-errors.log
          echo "Captured $(wc -l < /tmp/ci-errors.log) lines of error logs"

      - name: Claude Code — diagnose and fix
        if: steps.guard.outputs.skip == 'false'
        id: claude-fix
        continue-on-error: true
        run: |
          BRANCH_NAME="ci-autofix/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          git checkout -b "$BRANCH_NAME"

          cat > /tmp/ci-prompt.txt <<'PROMPT_END'
          The CI/CD build-and-test job failed. The error logs are in /tmp/ci-errors.log — read that file first.

          Your task:
          1. Read /tmp/ci-errors.log to understand the failure
          2. Determine if this is a build error (TypeScript compilation) or a test failure
          3. Analyze the errors and identify the root cause
          4. Fix the code — edit the minimal set of files needed
          5. If it's a test failure:
             - Read the failing test file AND the source file it tests
             - Determine if the test is wrong (outdated assertions) or the source code has a bug
             - Fix whichever is actually incorrect
             - Run the specific test to verify: npx jest --no-cache <test-file> --forceExit
          6. If it's a build error:
             - Fix the TypeScript errors
             - Run npm run build in the affected service to verify
          7. Stage ONLY the files you changed and commit with message: "fix: [ci-autofix] <description>"
          8. Do NOT push — the pipeline will handle pushing and PR creation

          Rules:
          - Do NOT blindly change test expectations — understand WHY the test fails first
          - Do NOT modify CI workflow files
          - Do NOT install new dependencies unless absolutely necessary
          - Do NOT run git push
          - If the error is in environment config (missing env vars, wrong URLs), skip — it's not a code fix
          - If you cannot fix the issue, create a GitHub issue describing the problem
          PROMPT_END

          npx -y @anthropic-ai/claude-code@latest \
            -p "$(cat /tmp/ci-prompt.txt)" \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --max-turns 25
        timeout-minutes: 10

      - name: Check if fix was produced
        if: steps.guard.outputs.skip == 'false'
        id: check-fix
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if git log --oneline "main..$CURRENT_BRANCH" 2>/dev/null | grep -q .; then
            echo "has_fix=true" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "has_fix=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude Code did not produce a fix"
          fi

      - name: Create issue if no fix produced
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "CI build failure needs manual fix ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## CI build failure — auto-fix failed

          The self-heal agent could not produce a code fix for this build failure.

          **Failed run:** $RUN_URL
          **Commit:** ${GITHUB_SHA:0:7}

          Please investigate manually.
          EOF
          )" \
            --label "bug,ci"

      - name: Push branch and create PR
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="${{ steps.check-fix.outputs.branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "fix: [ci-autofix] Auto-fix for build failure" \
            --body "$(cat <<EOF
          ## Auto-generated fix

          Claude Code analyzed the CI build failure and produced this fix automatically.

          **Source run:** $RUN_URL

          > Review carefully before merging — this is an automated fix.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"

  # ─── Step 4: Deploy to the local environment ─────────────────────────
  # Разворачивает стек на cthulhu (local.lex) тем же compose-файлом, что и
  # ручной `manage-gateway.sh deploy local`, но под контролем пайплайна.
  deploy-local:
    name: Deploy Local Environment
    # ВАЖНО: пин на `local-deploy` — единственный лейбл, уникальный для cthulhu.
    # Лейбл `local` матчится и на prod-runner, и джоба уехала бы разворачивать
    # локальный стек прямо на проде (см. deploy-preview note в deploy-prod.yml).
    runs-on: [self-hosted, local-deploy]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result != 'failure' &&
      needs.build-and-test.result != 'cancelled' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy) ||
        (github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true')
      )
    timeout-minutes: 120
    steps:
      - name: Sync deployment checkout
        run: |
          set -euo pipefail
          REPO="$HOME/SecondLayer"
          if [ ! -d "$REPO/.git" ]; then
            echo "::error::$REPO не является git-репозиторием — деплой-чекаут не найден"
            exit 1
          fi
          cd "$REPO"
          git fetch --prune origin
          git checkout main
          git reset --hard "${{ github.sha }}"
          echo "Развёрнутый коммит: $(git log --oneline -1)"

      - name: Verify local env file
        run: |
          set -euo pipefail
          ENV_FILE="$HOME/SecondLayer/deployment/.env.local"
          if [ ! -s "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE отсутствует или пуст (секреты не в git — файл живёт на машине)"
            exit 1
          fi
          echo "Переменных в .env.local: $(grep -cE '^[A-Z_]+=' "$ENV_FILE")"

          # Значение переменной — ПОСЛЕДНЕЕ её определение: так читает docker compose.
          # Файл переживал несколько переездов, ключи в нём дублируются, и
          # смотреть на первое вхождение — верный способ обмануть самого себя.
          # `|| true` внутри: при set -e и pipefail ненайденная переменная иначе
          # роняет шаг на первом же присваивании, и до остальных проверок дело
          # не доходит — проверка молчит ровно там, где должна ругаться.
          val() { { grep -E "^$1=" "$ENV_FILE" || true; } | tail -1 | cut -d= -f2- ; }
          cnt() { { grep -cE "^$1=" "$ENV_FILE" || true; } | tail -1 ; }

          fail=0
          bad() { echo "::error::$*"; fail=1; }

          PUBLIC_URL=$(val PUBLIC_URL)
          [ -n "$PUBLIC_URL" ] || bad "PUBLIC_URL не задан — не с чем сверять остальные адреса"
          echo "Публичный адрес стенда: ${PUBLIC_URL:-<пусто>}"

          # 1. Адреса. Всё, что уходит наружу (редирект OAuth, ссылки в письмах,
          # ссылка на пополнение, публичные URL файлов), должно вести на тот же
          # домен, на котором стенд реально отвечает. 27.08.2026 боевой домен
          # переехал на этот хост, а FRONTEND_URL и GOOGLE_CALLBACK_URL остались
          # на local.legal.org.ua — вход через Google уводил на чужой адрес.
          if [ -n "$PUBLIC_URL" ]; then
            for v in FRONTEND_URL GOOGLE_CALLBACK_URL MINIO_PUBLIC_URL; do
              cur=$(val "$v")
              if [ -z "$cur" ]; then
                echo "::warning::$v не задан — возьмётся значение по умолчанию из compose"
              elif [ "${cur#$PUBLIC_URL}" = "$cur" ]; then
                bad "$v=$cur не начинается с PUBLIC_URL=$PUBLIC_URL"
              fi
            done

            # 2. CORS. Бэкенд отдаёт заголовки только для перечисленных здесь
            # источников; nginx их больше не дублирует. Домена нет в списке —
            # браузер не увидит X-Total-Count и прочие exposed-заголовки.
            ORIGINS=$(val ALLOWED_ORIGINS)
            case ",$ORIGINS," in
              *",$PUBLIC_URL,"*) : ;;
              *) bad "ALLOWED_ORIGINS не содержит $PUBLIC_URL (сейчас: ${ORIGINS:-<пусто>})" ;;
            esac
          fi

          # 3. Ключи межсервисных вызовов. Сервис принимает список *_API_KEYS,
          # бэкенд стучится одиночным *_API_KEY. Разошлись — сервис отвечает
          # 401, а чат молча теряет его инструменты: ровно так 27.08.2026
          # пропали все 12 инструментов openreyestr, и заметно это было только
          # по строчке "not registered in ToolRegistry" в логах.
          for svc in OPENREYESTR RADA; do
            one=$(val "${svc}_API_KEY"); many=$(val "${svc}_API_KEYS")
            [ -n "$one" ] && [ -n "$many" ] || continue
            case ",$many," in
              *",$one,"*) echo "${svc}: ключ бэкенда есть в списке принимаемых" ;;
              *) bad "${svc}_API_KEY не входит в ${svc}_API_KEYS — сервис ответит 401 и его инструменты выпадут из чата" ;;
            esac
          done

          # 4. Режим. В development бэкенд отдаёт клиенту текст внутренней
          # ошибки и пускает любой localhost-источник. На публичном домене это
          # утечка, поэтому здесь только production.
          NODE_ENV=$(val NODE_ENV)
          case "$PUBLIC_URL" in
            *localhost*|*local.legal.org.ua*) : ;;
            *) [ "$NODE_ENV" = "production" ] || bad "NODE_ENV=${NODE_ENV:-<пусто>} на публичном домене $PUBLIC_URL — нужен production" ;;
          esac

          # Дубли сами по себе не ошибка (файл так устроен), но именно из-за них
          # правка «в нужной строке» может не подействовать — печатаем явно.
          for v in PUBLIC_URL FRONTEND_URL ALLOWED_ORIGINS NODE_ENV GOOGLE_CALLBACK_URL MINIO_PUBLIC_URL OPENREYESTR_API_KEY OPENREYESTR_API_KEYS; do
            n=$(cnt "$v")
            [ "${n:-0}" -gt 1 ] && echo "::warning::$v определён $n раз — действует последний"
          done

          [ "$fail" = "0" ] || { echo "::error::.env.local рассогласован — деплой остановлен до правки файла на машине"; exit 1; }
          echo "Проверка .env.local пройдена"

      - name: Guard against unreadable paths in the checkout
        run: |
          set -euo pipefail
          cd "$HOME/SecondLayer"
          UNREADABLE=$(find . -type d ! -readable 2>/dev/null || true)
          if [ -n "$UNREADABLE" ]; then
            echo "::error::каталоги, которые не прочитает сборщик контекста (обычно pgdata под uid postgres):"
            echo "$UNREADABLE"
            echo "Их надо вынести из репозитория: .dockerignore не спасает, из-за !-паттернов сборщик всё равно обходит дерево."
            exit 1
          fi
          echo "нечитаемых путей нет"

      - name: Overlay proprietary source
        env:
          CORE_REPO_SSH_KEY: ${{ secrets.CORE_REPO_SSH_KEY }}
        run: |
          set -euo pipefail
          REPO="$HOME/SecondLayer"
          CORE_TMP=$(mktemp -d)
          KEY_FILE=$(mktemp)
          trap 'shred -u "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"; rm -rf "$CORE_TMP"' EXIT
          printf '%s\n' "$CORE_REPO_SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          GIT_SSH_COMMAND="ssh -i $KEY_FILE -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:overthelex/secondlayer-core.git "$CORE_TMP"
          test -s "$CORE_TMP/src/services/chat-execution-loop.ts" && test -s "$CORE_TMP/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core clone incomplete — key files missing in $CORE_TMP"; exit 1; }
          find "$CORE_TMP"/src/services -maxdepth 1 -name '*.ts' -exec cp -f {} "$REPO/mcp_backend/src/services/" \;
          cp -rf "$CORE_TMP"/src/prompts/* "$REPO/mcp_backend/src/prompts/"
          test -s "$REPO/mcp_backend/src/services/chat-execution-loop.ts" && test -s "$REPO/mcp_backend/src/prompts/chat-system-prompt.ts" \
            || { echo "::error::core overlay failed — key files missing after copy"; exit 1; }
          echo "Оверлей на месте: $(find "$REPO/mcp_backend/src/services" -maxdepth 1 -name '*.ts' | wc -l) файлов в services"

      - name: Deploy stack (blue-green)
        run: |
          set -euo pipefail
          cd "$HOME/SecondLayer/deployment"
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"
          COLORS=.active-colors-local
          INC=nginx/includes/local-upstreams.conf

          # Активный цвет: файл — подсказка, docker — истина.
          CUR=$(grep '^app=' "$COLORS" 2>/dev/null | cut -d= -f2 || echo blue)
          if docker inspect secondlayer-app-local-green --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
            CUR=green
          elif docker inspect secondlayer-app-local --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
            CUR=blue
          fi
          [ "$CUR" = "green" ] && NEW=blue || NEW=green
          echo "активен: $CUR, выкатываем: $NEW"

          # Апстримы приводим к ТЕКУЩЕМУ цвету до того, как что-либо коснётся
          # nginx. Файл не в git (см. .gitignore) именно потому, что раньше он
          # там был: `git reset --hard` возвращал в него цвет времён коммита,
          # и nginx, пересозданный следом, падал в цикле — `host not found in
          # upstream`. 27.08.2026 это стоило 79 секунд простоя боевого домена.
          # На чистой машине файла может не быть вовсе, поэтому пишем всегда.
          if [ "$CUR" = "green" ]; then CUR_BE=secondlayer-app-local-green; CUR_FE=lexwebapp-local-green
          else CUR_BE=secondlayer-app-local; CUR_FE=lexwebapp-local; fi
          printf '# Активные апстримы — переписывает джоба деплоя, руками не править\n\nupstream local_mcp_backend {\n    server %s:3000;\n    keepalive 128;\n}\n\nupstream local_frontend {\n    server %s:80;\n    keepalive 32;\n}\n' "$CUR_BE" "$CUR_FE" > "$INC"
          echo "апстримы указывают на работающий цвет: $CUR_BE / $CUR_FE"

          if [ "${{ inputs.no_cache }}" = "true" ]; then
            $DC build --no-cache
          fi

          # Сначала собираем образы — сборка ничего не трогает в работающем.
          $DC build

          # Обновляем ВСЁ, КРОМЕ цветных сервисов. Это ключевой момент: обычный
          # `up -d` пересоздал бы и активный цвет, а значит уронил бы сайт на
          # время пересоздания — ровно то, ради чего затевался blue-green.
          # Список считаем динамически, чтобы новый сервис не пришлось
          # вписывать сюда руками.
          # Без --remove-orphans: рядом крутятся qdrant-edrsr-local и
          # qdrant-general-local, которые обслуживают ПРОД.
          OTHERS=$($DC config --services | grep -vE '^(app-local|app-local-green|lexwebapp-local|lexwebapp-local-green)$' | tr '\n' ' ')
          echo "обновляю вне blue-green: $(echo $OTHERS | wc -w) сервисов"
          # --no-deps обязателен: nginx-local объявлен зависящим от app-local и
          # lexwebapp-local, и без этого флага compose поднимет их как
          # зависимости — то есть пересоздаст активный цвет. Так и вышло
          # 26.08: 10 секунд 502 у пользователей ещё до переключения цвета.
          $DC up -d --no-deps $OTHERS

          # Конфиг монтируется КАТАЛОГОМ (см. compose), поэтому правка из git
          # видна контейнеру сразу и пересоздавать nginx не нужно: reload
          # достаточно. Пересоздание здесь стоило бы секунд простоя на каждом
          # деплое, трогающем конфиг.
          #
          # После пересоздания сервисов выше их IP меняются, а nginx резолвит
          # имена апстримов один раз при старте — та самая причина 502 из
          # #2325. Перечитываем конфиг сразу, не дожидаясь переключения цвета:
          # если выкатка нового цвета сорвётся, старый останется доступен.
          # Сверяем содержимое, а не inode: с каталогом они и так совпадают,
          # а расхождение содержимого поймает любой будущий возврат к файловому
          # монтированию. md5 вместо diff — не нужен stdin в контейнер.
          HOST_MD5=$(md5sum nginx/conf.d/local-docker.conf | cut -d' ' -f1)
          CTR_MD5=$(docker exec nginx-local md5sum /etc/nginx/conf.d/local-docker.conf 2>/dev/null | cut -d' ' -f1 || echo нет)
          if [ "$HOST_MD5" != "$CTR_MD5" ]; then
            echo "::warning::контейнер видит не тот конфиг, что лежит на машине — пересоздаю nginx"
            $DC up -d --no-deps --force-recreate nginx-local
            for i in $(seq 1 12); do
              docker exec nginx-local nginx -t >/dev/null 2>&1 && break
              echo "  ждём nginx... ($i/12)"; sleep 5
            done
          fi
          docker exec nginx-local nginx -t && docker exec nginx-local nginx -s reload 2>/dev/null || true

          # Новый цвет
          if [ "$NEW" = "green" ]; then
            # висяк от прошлой сорвавшейся выкатки не должен мешать
            docker rm -f secondlayer-app-local-green lexwebapp-local-green >/dev/null 2>&1 || true
            $DC --profile green up -d app-local-green lexwebapp-local-green
            BE=secondlayer-app-local-green; FE=lexwebapp-local-green
          else
            docker rm -f secondlayer-app-local lexwebapp-local >/dev/null 2>&1 || true
            $DC up -d app-local lexwebapp-local
            BE=secondlayer-app-local; FE=lexwebapp-local
          fi

          # Здоровье проверяем ДО переключения трафика: если новый цвет не
          # поднялся, старый продолжает обслуживать пользователей.
          ok=false
          for i in $(seq 1 30); do
            if docker exec "$BE" wget -q -O /dev/null --timeout=5 http://127.0.0.1:3000/health 2>/dev/null \
               && docker exec "$FE" wget -q -O /dev/null --timeout=5 http://127.0.0.1/ 2>/dev/null; then
              ok=true; break
            fi
            echo "  ждём $NEW... ($i/30)"
            sleep 10
          done
          if [ "$ok" != "true" ]; then
            echo "::error::$NEW не поднялся — трафик НЕ переключён, работает $CUR"
            docker logs --tail 60 "$BE" || true
            exit 1
          fi
          echo "$NEW здоров"

          # Переключение. `nginx -s reload` перечитывает конфиг и заново
          # резолвит имена апстримов — именно эта однократность резолва дала
          # 502 на весь local.legal.org.ua после мержа #2325 (app healthy,
          # nginx "Up 26 hours", публичный /health -> 502). Раньше лечилось
          # пересозданием nginx, теперь достаточно reload: соединения живы.
          printf '# Активные апстримы — переписывает джоба деплоя, руками не править\n\nupstream local_mcp_backend {\n    server %s:3000;\n    keepalive 128;\n}\n\nupstream local_frontend {\n    server %s:80;\n    keepalive 32;\n}\n' "$BE" "$FE" > "$INC"
          docker exec nginx-local nginx -t
          docker exec nginx-local nginx -s reload
          printf 'app=%s\n' "$NEW" > "$COLORS"
          echo "трафик переключён на $NEW"

          # Старый цвет гасим только теперь
          if [ "$CUR" = "green" ]; then
            docker stop secondlayer-app-local-green lexwebapp-local-green >/dev/null 2>&1 || true
          else
            docker stop secondlayer-app-local lexwebapp-local >/dev/null 2>&1 || true
          fi
          echo "старый цвет ($CUR) остановлен"
          $DC ps

      - name: Verify through nginx
        run: |
          set -euo pipefail

          # TLS проверяем ОТДЕЛЬНО и по имени публичного домена. 27.08.2026
          # деплой вернул конфиг из git, где путь к сертификату остался от
          # local-имён: nginx поднялся, /health отдавал 200, а снаружи
          # Cloudflare 79 секунд отвечал 526, потому что сертификат не покрывал
          # legal.org.ua. Проверка ниже смотрела на 127.0.0.1 по http и этого
          # не видела — отказ был виден только тому, кто ходит с проверкой цепочки.
          PUB=$({ grep -E '^PUBLIC_URL=' "$HOME/SecondLayer/deployment/.env.local" || true; } | tail -1 | cut -d= -f2-)
          HOST=$(printf '%s' "$PUB" | sed -E 's#^https?://##; s#/.*##')
          if [ -n "$HOST" ]; then
            SAN=$(echo | openssl s_client -servername "$HOST" -connect 127.0.0.1:443 2>/dev/null \
                  | openssl x509 -noout -ext subjectAltName 2>/dev/null || true)
            PARENT=$(printf '%s' "$HOST" | cut -d. -f2-)
            if printf '%s' "$SAN" | grep -qF "DNS:$HOST" || printf '%s' "$SAN" | grep -qF "DNS:*.$PARENT"; then
              echo "сертификат покрывает $HOST"
            else
              echo "::error::сертификат, отдаваемый на имя $HOST, его не покрывает — снаружи это Cloudflare 526"
              echo "SAN: ${SAN:-<не получен>}"
              grep -n 'ssl_certificate ' "$HOME/SecondLayer/deployment/nginx/conf.d/local-docker.conf" | head -4
              exit 1
            fi
          else
            echo "::warning::PUBLIC_URL пуст — проверку сертификата пропускаю"
          fi

          # Проверяем не контейнер, а путь целиком — так же, как его видит пользователь
          for i in $(seq 1 12); do
            code=$(docker exec nginx-local wget -q -O /dev/null -S --header="Host: local.legal.org.ua" http://127.0.0.1/health 2>&1 | grep -oE "HTTP/1.[01] [0-9]+" | tail -1 | awk '{print $2}' || true)
            if [ "$code" = "200" ]; then echo "nginx отдаёт /health: 200"; exit 0; fi
            echo "  ждём nginx... ($i/12, последний код: ${code:-нет ответа})"
            sleep 5
          done
          echo "::error::nginx не отдаёт /health после переключения цвета"
          docker exec nginx-local cat /etc/nginx/includes/local-upstreams.conf || true
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Локальное окружение развёрнуто"
            echo ""
            echo "- Коммит: \`${{ github.sha }}\`"
            echo "- URL: https://local.legal.org.ua"
            echo ""
            echo '```'
            cd "$HOME/SecondLayer/deployment"
            docker compose -f docker-compose.local.yml --env-file .env.local ps --format '{{.Name}}\t{{.Status}}' 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
