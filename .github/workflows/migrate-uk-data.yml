##############################################################################
# Move the UK corpus from one box to another, and prove it arrived.
#
# The schema is NOT copied. The target builds its own from
# mcp_backend/src/migrations/sets/uk.txt (MIGRATION_SET=uk, 132 of 220
# migrations) when deploy-lawrider-uk.yml runs — so this workflow moves rows and
# nothing else. Run the deploy first; this refuses to start if the tables are
# not there.
#
# What moves: 12 uk_* tables, 6.9 GB. What does not: the bulk archives in
# /data/uk — 28 GB of zips that re-download from research.legislation.gov.uk in
# minutes, and the weekly refresh fetches them anyway — nor four of the source's
# sixteen uk_ tables: two that are working residue, and the two judgment-access
# tables, which are per-box grants keyed on users(id) (see the manifest step).
#
# The safety property is the manifest. A dump that half-arrives still looks like
# a successful copy from the outside; here the source's row counts travel with
# the data and the job fails on the first table that disagrees.
#
# ⚠ Dispatch only, and it TRUNCATES the target's uk_* tables before loading. It
# is a move, not a merge: running it against a box that already has the corpus
# replaces it.
##############################################################################
name: 'Migrate: UK corpus to another box'

on:
  workflow_dispatch:
    inputs:
      source_host:
        description: 'IP of the box to copy FROM (the target is LAWRIDER_GCP_HOST)'
        required: true
        type: string
      dry_run:
        description: 'Take the manifest and compare, copy nothing'
        type: boolean
        default: true
      force_overwrite:
        description: 'Proceed even though the target already holds data — Copy truncates it, so those rows are destroyed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migrate-uk-data
  cancel-in-progress: false

env:
  GCP_USER: ubuntu
  PG: pg-lawrider
  DB: secondlayer_prod

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_HOST: ${{ secrets.LAWRIDER_GCP_HOST }}
      SOURCE_HOST: ${{ inputs.source_host }}
    steps:
      # Needed for deployment/lawrider-gcp/known_hosts. This job never checked
      # out the repository before, because it only ever shelled out over SSH —
      # pinning the target's host key gave it a file dependency and the cp would
      # have failed on a bare runner.
      - uses: actions/checkout@v4

      - name: Set up SSH to both boxes
        run: |
          for v in TARGET_HOST SOURCE_HOST; do
            [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }
          done
          if [ "$TARGET_HOST" = "$SOURCE_HOST" ]; then
            echo "::error::source and target are the same box ($TARGET_HOST)"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.LAWRIDER_GCP_SSH_KEY }}" > ~/.ssh/gcp
          chmod 600 ~/.ssh/gcp
          # The TARGET is our box and its key is pinned in the repository.
          cp deployment/lawrider-gcp/known_hosts ~/.ssh/known_hosts_uk
          # The SOURCE is a dispatch input — any address someone types — so there
          # is nothing to pin it against and this stays trust-on-first-use. It is
          # the tolerable half: the source is only ever read from (pg_dump), so a
          # wrong host yields a bad copy that the manifest comparison then
          # rejects, rather than a write to somewhere it should not go.
          ssh-keyscan -H "$SOURCE_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SRC=ssh -i $HOME/.ssh/gcp -o ServerAliveInterval=30 ${GCP_USER}@${SOURCE_HOST}" >> "$GITHUB_ENV"
          echo "DST=ssh -i $HOME/.ssh/gcp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_uk -o ServerAliveInterval=30 ${GCP_USER}@${TARGET_HOST}" >> "$GITHUB_ENV"

      - name: The target must already have the schema
        run: |
          # Built by the deploy, not by this job. If it is missing, the deploy has
          # not run — loading data into nothing would fail halfway and leave a
          # box that looks provisioned.
          n=$($DST "docker exec $PG psql -U secondlayer -d $DB -Atc \"select count(*) from pg_tables where schemaname='public' and tablename like 'uk!_%' escape '!'\"" 2>/dev/null || echo 0)
          echo "uk_ tables on the target: $n"
          [ "$n" -ge 14 ] || { echo "::error::target has $n uk_ tables, expected at least 14 — run deploy-lawrider-uk.yml first"; exit 1; }

      - name: Both boxes must be still
        run: |
          # The manifest and the dump are two reads of the source, and a refresh
          # running between them moves the corpus underneath both: rows arrive
          # after they were counted, verification fails on numbers that were
          # right when taken, and the run looks like a corruption it is not.
          #
          # The TARGET matters just as much, for a worse reason. The guard below
          # counts its rows and Copy then truncates; a refresh starting in
          # between writes rows that were never counted and are destroyed a
          # moment later. Checking here does not close that window — nothing
          # short of a lock would — but it turns the common case, a Monday cron
          # overlapping a dispatch, from silent into refused.
          #
          # The bracket is not decoration — pgrep -f matches its own command
          # line, so the unbracketed pattern finds this check and reports a
          # refresh that is not running.
          # pgrep exits 1 for "found nothing" and the ssh itself exits 255 when
          # it cannot reach the box at all. Collapsing those into one `if` reads
          # an unreachable source as a quiet one, which is the wrong direction
          # to be wrong in when the next step starts moving data.
          for side in source target; do
            [ "$side" = source ] && cmd="$SRC" || cmd="$DST"
            set +e
            $cmd "pgrep -f '[r]un-uk-refresh' >/dev/null"; rc=$?
            set -e
            case "$rc" in
              0) echo "::error::a UK refresh is running on the $side box — wait for it to finish, then re-run"; exit 1 ;;
              1) echo "  $side: no refresh running" ;;
              *) echo "::error::could not ask the $side box whether a refresh is running (ssh/pgrep exit $rc)"; exit 1 ;;
            esac
          done

      - name: Take the source manifest
        run: |
          # Counted per table on the source, and compared on the target after the
          # load. This is the only thing that distinguishes "the dump ran" from
          # "the data is there" — so an empty manifest is not an empty result,
          # it is the check itself having failed. Without ON_ERROR_STOP a psql
          # error still exits 0 and writes nothing, and the verify step below
          # would then loop over no tables and report success having compared
          # nothing at all.
          $SRC "docker exec $PG psql -U secondlayer -d $DB -v ON_ERROR_STOP=1 -Atc \"
            select string_agg(t || ':' || n, ',' order by t) from (
              select tablename t, (xpath('/row/c/text()',
                     query_to_xml('select count(*) c from '||quote_ident(tablename), false, true, '')))[1]::text::bigint n
                from pg_tables where schemaname='public' and tablename like 'uk!_%' escape '!'
                 -- Not every uk_ table is the corpus. Left behind deliberately:
                 --   *_repair_backup_*  a column backup from the August 2026
                 --     metadata repair, 53,469 rows, kept on the old box while
                 --     that repair was in doubt. It no longer is.
                 --   uk_bulk_probe      130,026 rows of notes from working out
                 --     what the bulk archives contain.
                 -- Neither is British law or a UK judgment. Say so out loud if
                 -- you want them: this is the moment they stop existing.
                 --
                 --   uk_judgment_access, uk_judgment_access_log
                 --     Not corpus either: who on THAT box may read Find Case Law
                 --     judgments. Both reference users(id), and users is not
                 --     copied — so a data-only load of the two grants currently
                 --     on the source would fail on a foreign key, and if it
                 --     somehow did not, it would name user ids that mean
                 --     someone else on the target. Access is granted on the box
                 --     it applies to.
                 and tablename !~ '_repair_backup_|^uk_bulk_probe$|^uk_judgment_access(_log)?$'
            ) s\"" > manifest.txt
          n=$(tr ',' '\n' < manifest.txt | grep -c ':' || true)
          echo "tables in the manifest: $n"
          tr ',' '\n' < manifest.txt | sed 's/^/  /'
          # 12 is the corpus: the source carries 16 uk_ tables, of which two are
          # working residue and two are the access grants excluded above. Fewer
          # than 12 means the source lost tables or the query matched less than
          # it should, and neither is a run to carry on with.
          [ "$n" -ge 12 ] || { echo "::error::manifest has $n tables, expected at least 12 — the source query failed or the source is not the box you think it is"; exit 1; }
          echo "MANIFEST=$(cat manifest.txt)" >> "$GITHUB_ENV"

      - name: The target must not be ahead of the source
        run: |
          # This workflow moves a corpus onto a NEW box. Once that box starts
          # doing its own work it pulls ahead, and running this again replaces
          # the newer data with the older — silently, because a truncate-and-load
          # reports success either way.
          #
          # Real numbers from 2026-09-20, the day after the move: London held
          # 354,777 version rows against Zurich's 332,807, and 1,776,909
          # provisions against 1,775,894. A re-run would have destroyed 21,970
          # base versions and the text of roughly 2,000 acts, and looked clean.
          # Two questions, not one.
          #
          # First: is the target populated at all? Copy TRUNCATES, so any populated
          # target loses what it has — not only one that is ahead. The original guard
          # asked only about being ahead, which let a target holding fewer rows be
          # wiped without anyone saying so out loud.
          #
          # Second: is it ahead? That is the case where the loss is certain to matter,
          # so it is reported separately with the tables and counts named.
          #
          # ON_ERROR_STOP on every count: without it a failed query returns an empty
          # string, `[ "" -gt N ]` is not a comparison, and the guard waves it through.
          populated=""; ahead=""
          for pair in $(tr ',' ' ' < manifest.txt); do
            t=${pair%%:*}; src=${pair##*:}
            tgt=$($DST "docker exec $PG psql -U secondlayer -d $DB -v ON_ERROR_STOP=1 -Atc 'select count(*) from $t'")
            case "$tgt" in
              ''|*[!0-9]*) echo "::error::could not count $t on the target (got '$tgt')"; exit 1 ;;
            esac
            # `if`, not `[ ... ] && ...`. GitHub runs these with `bash -e`, and an
            # AND-list whose test is false returns 1 — so an empty table, which is
            # the ordinary case on a fresh box, would fail the step.
            if [ "$tgt" -gt 0 ]; then populated="$populated $t($tgt)"; fi
            if [ "$tgt" -gt "$src" ]; then ahead="$ahead $t(target $tgt > source $src)"; fi
          done

          if [ -n "$ahead" ]; then
            echo "::error::the target is AHEAD of the source; copying would destroy newer data:$ahead"
          elif [ -n "$populated" ]; then
            echo "::error::the target already holds data and Copy truncates:$populated"
          fi
          if [ -n "$ahead" ] || [ -n "$populated" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              # A dry run copies nothing, so there is nothing to protect against
              # — and refusing here would disable the one mode that exists to
              # inspect a populated target before touching it.
              echo "dry run — reporting only; a real run would need force_overwrite=true"
            else
              echo "If replacing it is genuinely what you want, dispatch with force_overwrite=true."
              [ "${{ inputs.force_overwrite }}" = "true" ] || exit 1
              echo "force_overwrite set — continuing, and the rows above will be lost"
            fi
          else
            echo "target corpus tables are empty — nothing to lose"
          fi

      - name: Copy
        if: ${{ !inputs.dry_run }}
        run: |
          # Through the runner rather than box to box: the two have no SSH to each
          # other, deliberately, and giving them one for a single move would
          # outlive the move.
          #
          # --data-only because the schema is the target's own. pg_dump emits the
          # tables in dependency order, which matters: uk_provision_version
          # references uk_provision_text.
          tables=$(tr ',' '\n' < manifest.txt | cut -d: -f1 | sed 's/^/-t /' | tr '\n' ' ')
          list=$(tr ',' '\n' < manifest.txt | cut -d: -f1 | tr '\n' ',' | sed 's/,$//')
          echo "dumping: $(echo "$tables" | wc -w) table flags"

          # The truncate travels at the head of the same stream as the data, and
          # psql runs the whole thing as one transaction (-1). Two commands over
          # two ssh connections is the arrangement where a network blip between
          # them empties the target and leaves it that way: the job reports
          # failure, which is honest, but the box is now worse than before it
          # started. One transaction means a failure anywhere rolls the truncate
          # back with it and the old corpus is still there to retry against.
          { echo "TRUNCATE $list CASCADE;"; \
            $SRC "docker exec $PG pg_dump -U secondlayer -d $DB --data-only --no-owner $tables"; } \
            | gzip -1 \
            | $DST "gunzip | docker exec -i $PG psql -U secondlayer -d $DB -v ON_ERROR_STOP=1 -1 -q"
          echo "load finished"

      - name: Verify against the manifest
        run: |
          fail=0
          for pair in $(tr ',' ' ' < manifest.txt); do
            t=${pair%%:*}; want=${pair##*:}
            got=$($DST "docker exec $PG psql -U secondlayer -d $DB -Atc 'select count(*) from $t'")
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              printf '  %-32s source %12s  target %12s\n' "$t" "$want" "$got"
            elif [ "$want" != "$got" ]; then
              echo "::error::$t: source $want, target $got"
              fail=1
            else
              printf '  %-32s %12s ok\n' "$t" "$got"
            fi
          done
          [ "$fail" = "0" ] || exit 1
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry run — nothing was copied; the columns above are what a real run would reconcile"
          else
            echo "every table matches the source"
          fi

      - name: What the corpus looks like on the target
        if: ${{ !inputs.dry_run }}
        run: |
          $DST "docker exec $PG psql -U secondlayer -d $DB -c \"
            select (select count(*) from uk_legislation) acts,
                   (select count(distinct leg_id) from uk_legislation_provisions) acts_with_text,
                   (select count(*) from uk_provision_version) point_in_time_rows,
                   (select count(*) from uk_legislation_effects) effects,
                   (select count(*) from uk_court_decisions) judgments\""
