,"type":1326},"https://www.esbk.admin.ch/dam/de/sd-web/W0w04KsyYccF/62-2024-128-01-d.pdf","descending","Link in neuem Tab öffnen",{"de":127,"en":131,"fr":128,"it":129,"rm":130},"manual-download-list","doc-1jtks48851",{"properties":1756,"identifier":1294,"id":1759,"nestedContent":1760},{"accordionItems":1757},{"title":1758},"Rechtskräftige Leitentscheide des Bundesstrafgerichts und des Bundesgerichts","doc-1jtks48852",[1761,1765,1769,1773,1777,1781,1807,1811,1815,1819,1823,1827,1831,1835,1839,1843,1847],{"properties":1762,"identifier":1262,"id":1764},{"text":1763},"\u003Ca href=\"https://search.bger.ch/ext/eurospider/live/fr/php/clir/http/index.php?lang=fr&amp;type=highlight_simple_query&amp;page=1&amp;from_date=&amp;to_date=&amp;from_year=1954&amp;to_year=2026&amp;sort=relevance&amp;insertion_date=&amp;from_date_push=&amp;top_subcollection_clir=bge&amp;query_words=BGE+138+IV+106&amp;part=all&amp;de_fr=&amp;de_it=&amp;fr_de=&amp;fr_it=&amp;it_de=&amp;it_fr=&amp;orig=&amp;translation=&amp;rank=1&amp;highlight_docid=atf%3A%2F%2F138-IV-106%3Afr&amp;number_of_ranks=1&amp;azaclir=clir\" target=\"_self\" rel=\"external\" class=\"link--external\" aria-label=\"138 IV 106\">138 IV 106\u003C/a>\u003Cbr />Leitentscheid des Bundesgerichts (BGer) vom 16. März 2012 betreffend das Organisieren oder gewerbsmässige Betreiben von Glücksspielen ausserhalb konzessionierter Spielbanken (Art. 56 Abs. 1 lit. a SBG)","doc-1jtks48853",{"properties":1766,"identifier":1262,"id":1768},{"text":1767},"Der Betrieb eines Spielautomaten ausserhalb einer konzessionierten Spielbank kann diesen Straftatbestand nur erfüllen, wenn der Automat durch Verfügung der Eidgenössischen Spielbankenkommission als Glücksspielautomat qualifiziert worden ist und allfällige Rechtsmittel gegen diese Verfügung keine aufschiebende Wirkung haben. Fehlt eine Verfügung der Eidgenössischen Spielbankenkommission, kann es nicht die Aufgabe des Strafrichters sein, vorfrageweise darüber zu entscheiden, ob das Gerät als Glücksspielautomat zu qualifizieren ist (E. 5.3.2).","doc-1jtks48854",{"properties":1770,"identifier":1262,"id":1772},{"text":1771},"\u003Ca target=\"_blank\" href=\"https://search.bger.ch/ext/eurospider/live/de/php/clir/http/index.php?lang=de&amp;type=highlight_simple_query&amp;page=1&amp;from_date=&amp;to_date=&amp;from_year=1954&amp;to_year=2026&amp;sort=relevance&amp;insertion_date=&amp;from_date_push=&amp;top_subcollection_clir=bge&amp;query_words=BGE+136+II+291&amp;part=all&amp;de_fr=&amp;de_it=&amp;fr_de=&amp;fr_it=&amp;it_de=&amp;it_fr=&amp;orig=&amp;translation=&amp;rank=1&amp;highlight_docid=atf%3A%2F%2F136-II-291%3Afr&amp;number_of_ranks=6&amp;azaclir=clir\" rel=\"external\" class=\"link--external\" aria-label=\"136 II 291 Link in neuem Tab öffnen\">136 II 291\u003C/a>\u003Cbr />Leitentscheid des Bundesgerichts (BGer) vom 20. Mai 2010 betreffend den Glücksspielcharakter von «Texas Hold’em»-Pokerturnieren","doc-1jtks48855",{"properties":1774,"identifier":1262,"id":1776},{"text":1775},"Die Eidgenössische Spielbankenkommission ist befugt, darüber zu befinden, ob ein bestimmtes Spiel als Glücksspiel in den Anwendungsbereich des Spielbankengesetzes oder als Geschicklichkeits- oder Unterhaltungsspiel in den Zuständigkeitsbereich der Kantone fällt (E. 3).","doc-1jtks48856",{"properties":1778,"identifier":1262,"id":1780},{"text":1779},"Bei den umstrittenen «Texas Hold'em»-Pokerturnieren handelt es sich um «gemischte» Spiele, bei denen nicht erstellt ist, dass der Geschicklichkeitsfaktor das Zufallselement der Kartenverteilung überwiegt; entsprechende Turniere können deshalb nach Sinn und Zweck des Spielbankengesetzes nur in Casinos öffentlich durchgeführt werden (E. 4 und 5).","doc-1jtks48857",{"properties":1782,"identifier":1753,"id":1806},{"title":219,"description":219,"linkText":219,"link":219,"listItems":1783,"linkAlt":219,"order":1803,"sortOrder":1804,"linkTargetLabelBlank":1751,"titleDownload":191,"languageTranslations":1805,"pageCountAddition":156},[1784],{"id":178
