# Top-level path segments the SPA router knows (src/router/routes.ts). Paths
# with no file on disk are served the SPA shell with 200 only under one of
# these; anything else is a real 404 (no soft-404s for crawlers). The SPA
# still boots on the 404 page, so a missed prefix degrades to a 404 status,
# not a broken page. src/seo/__tests__/nginx-spa-routes.test.ts keeps this
# list in sync with routes.ts.
# noindex for investor material. Keyed on $request_uri because a page with no
# prerendered file is served via an internal redirect to /index.html, which
# would lose a header set only in the investor location.
map $request_uri $x_robots_tag {
    default "";
    ~^/(investor|uk_investor|uk_investor_simplified)(/|\?|$) "noindex, follow";
}

map $uri $spa_route {
    default 0;
    ~^/$ 1;
    ~^/(about|abuse|admin|analysis|attorney|attorneys|billing|blog|calendar|career|case-analysis|chat|cisoacademy|clients|consultations|data-sources|de|decisions|developer|documents|ee|en|es|eu|fr|history|investor|invoices|judges|lawyers|legislation|login|matters|mcp-connect|my-contracts|news|nl|oferta|payment|product|profile|r|referral|reset-password|shared|team|time-entries|ua|uk|uk_investor|uk_investor_simplified|us|usage|verify-email|workflows)(/|$) 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from generating absolute redirects with http:// scheme
    # when behind a reverse proxy (Cloudflare/ALB terminates TLS)
    absolute_redirect off;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Scanner probes. A static SPA build never has dot-files (.env, .git, .aws,
    # .ssh ...), server-side scripts (.php, .asp, .jsp ...), dumps or archives,
    # nor WordPress/phpMyAdmin/Spring/Laravel paths. Answer 404 instead of
    # falling through to index.html, so a scanner does not see 200 on every
    # path. /.well-known/ is left alone (OAuth discovery, ACME, app links).
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php\d?|phtml|phar|asp|aspx|ashx|jsp|jspx|do|action|cgi|pl|py|rb|sh|bash|sql|sqlite|db|bak|old|orig|save|swp|tmp|log|ini|conf|cfg|yml|yaml|env|tfstate|pem|key|crt|tar|tgz|gz|zip|rar|7z|toml|properties|config|map)$ {
        return 404;
    }
    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json|phpmyadmin|pma|cgi-bin|vendor|actuator|swagger|swagger-ui|api-docs|server-status|server-info|_profiler|telescope|_next|static/js|www/js|storage|bootstrap|prisma|@fs|graphql|api/graphql|META-INF|WEB-INF)(/|$) {
        return 404;
    }
    # Framework/config files a scanner expects at the web root (08.11 scan from 128.14.224.214):
    # none of them exist in a static SPA build, so never answer with index.html.
    location ~ ^/(package(-lock)?\.json|composer\.(json|lock)|secrets\.json|keys\.json|credentials(\.json)?|service-account\.json|config\.json|settings\.json|app\.json|firebase\.json|vercel\.json|wrangler\.toml|netlify\.toml|serverless\.ya?ml|docker-compose[^/]*\.ya?ml|openapi\.json|swagger\.json|api-docs\.json|postman_[^/]*\.json|cypress\.env\.json|next\.config\.[cm]?js|artisan|env\.js|config\.js|settings\.js|phpinfo[^/]*)$ {
        return 404;
    }
    # Only manifest.json lives in the web root. Every other root-level .json is a scanner hunting
    # cloud keys (gcp-sa.json, firebase-adminsdk.json, service_account.json, ...) and the 10.11 scan
    # got index.html with 200 for each of them. /_environment is a framework debug probe.
    location ~ ^/(?!manifest\.json$)[^/]+\.json$ {
        return 404;
    }
    location ~ /_environment(/|$) {
        return 404;
    }
    # Config files scanners look for at any depth (09.11 scan from 34.22.204.254: /appsettings.json,
    # /Dockerfile and /app/auth.json came back 200 with index.html).
    location ~ /(appsettings[^/]*\.json|auth\.json|aws-exports\.[a-z]+|Dockerfile[^/]*|(env|runtime)-config\.js|app\.config\.js)$ {
        return 404;
    }

    # Investor material stays reachable by link but out of search results.
    # (add_header in a location drops the server-level ones, so repeat them.)
    location ~ ^/(investor|uk_investor|uk_investor_simplified)(/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/index.html /index.html;
    }
    location ~ ^/(pitch-deck\.(html|pdf)|partner-onepager\.html)$ {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # SPA routing — serve prerendered pages, else the SPA shell for known
    # routes, else 404 (body = dist/404.html: the shell with noindex).
    # Use $uri/index.html instead of $uri/ to avoid nginx auto-redirecting to add trailing slash
    # (which causes redirect loops behind Cloudflare/reverse proxy)
    location / {
        try_files $uri $uri/index.html @spa;
    }
    location @spa {
        if ($spa_route = 0) {
            return 404;
        }
        rewrite ^ /index.html last;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets
    location ~* \.(mjs|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header X-Robots-Tag $x_robots_tag always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
