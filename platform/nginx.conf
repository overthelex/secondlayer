server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Scanner probes. A static SPA build never has dot-files (.env, .git, .aws,
    # .ssh ...), server-side scripts (.php, .asp, .jsp ...), dumps or archives,
    # nor WordPress/phpMyAdmin/Spring/Laravel paths. Answer 404 instead of
    # falling through to index.html, so a scanner does not see 200 on every
    # path. /.well-known/ is left alone (OAuth discovery, ACME, app links).
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php\d?|phtml|phar|asp|aspx|ashx|jsp|jspx|do|action|cgi|pl|py|rb|sh|bash|sql|sqlite|db|bak|old|orig|save|swp|tmp|log|ini|conf|cfg|yml|yaml|env|tfstate|pem|key|crt|tar|tgz|gz|zip|rar|7z)$ {
        return 404;
    }
    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json|phpmyadmin|pma|cgi-bin|vendor|actuator|swagger|swagger-ui|api-docs|server-status|server-info|_profiler|telescope)(/|$) {
        return 404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
}
