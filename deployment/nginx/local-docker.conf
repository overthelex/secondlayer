# Docker-based Local Development Nginx Configuration
# Runs inside nginx-local container, routes to Docker service names
#
# Upstreams:
#   app-local:3000       — backend (Docker container)
#   lexwebapp-local:80   — собранный SPA (nginx внутри образа), как на проде
#
# SSL terminated here using mkcert certs mounted from deployment/nginx/certs/

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Апстримы вынесены в отдельный файл: джоба деплоя переписывает его при
# переключении цвета, а этот конфиг остаётся неизменным.
include /etc/nginx/includes/local-upstreams.conf;

# HTTP server (port 80)
server {
    listen 80;
    listen [::]:80;
    server_name legal.org.ua www.legal.org.ua localdev.legal.org.ua local.legal.org.ua local.mcp.legal.org.ua usa.legal.org.ua uk.legal.org.ua de.legal.org.ua fr.legal.org.ua nl.legal.org.ua ee.legal.org.ua eu.legal.org.ua ua.legal.org.ua;

    access_log /var/log/nginx/local-access.log;
    error_log /var/log/nginx/local-error.log;

    client_max_body_size 50M;

    # ACME challenge for Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ==========================================
    # OAuth Discovery Endpoints (RFC 8414)
    # ==========================================

    location = /.well-known/oauth-authorization-server {
        rewrite ^/.well-known/oauth-authorization-server$ /oauth/.well-known/oauth-authorization-server break;
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }

    location = /.well-known/openid-configuration {
        rewrite ^/.well-known/openid-configuration$ /oauth/.well-known/openid-configuration break;
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }

    # ==========================================
    # OAuth Authorization Flow
    # ==========================================

    location /oauth/ {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /authorize {
        return 301 http://$host/oauth/authorize$is_args$args;
    }

    location = /token {
        return 307 http://$host/oauth/token;
    }

    # ==========================================
    # Health Check
    # ==========================================

    location /health {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Prometheus metrics (no auth)
    location /metrics {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ==========================================
    # MCP Discovery
    # ==========================================

    location /mcp {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # MCP SSE Endpoints (long timeout)
    # ==========================================

    location /sse {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no";
    }

    location /v1/sse {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 75s;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no";
    }

    # ==========================================
    # Authentication Routes
    # ==========================================

    location /auth {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==========================================
    # External RSS Proxy (KMU news)
    # ==========================================

    location = /proxy/kmu-rss {
        proxy_pass https://www.kmu.gov.ua/api/rss;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_set_header Host www.kmu.gov.ua;
        proxy_set_header Accept "application/rss+xml";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Type "application/xml; charset=utf-8" always;
        proxy_cache_valid 200 10m;
    }

    # ==========================================
    # REST API Routes
    # ==========================================

    # Admin terminal WebSocket
    location /api/admin/terminal {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Video call signaling WebSocket
    location /api/ws/video-signaling {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ==========================================
    # Webhook Routes
    # ==========================================

    location /webhooks {
        proxy_pass http://local_mcp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_body_buffer_size 1m;
    }

    # ==========================================
    # Nextcloud (cloud file storage)
    # ==========================================

    location ^~ /nextcloud/ {
        resolver 127.0.0.11 valid=30s;
        set $nextcloud_upstream http://nextcloud-local:80;
        proxy_pass $nextcloud_upstream/nextcloud/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 512M;
    }

    # ==========================================
    # MinIO S3 Proxy (presigned URLs)
    # ==========================================

    location ^~ /s3/ {
        proxy_pass http://minio-local:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host minio-local:9000;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # ==========================================
    # Frontend (Vite dev server — plain HTTP inside Docker)
    # ==========================================

    location / {
        proxy_pass http://local_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

