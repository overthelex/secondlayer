# HTTP - opendata.legal.org.ua (LEX AI LLC company landing — static HTML)
server {
    listen 80;
    listen [::]:80;
    server_name opendata.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB -> redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    root /var/www/opendata;
    index index.html;

    location ~ /\.(?!well-known) {
        return 404;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|svg|jpg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS - opendata.legal.org.ua (direct access)
