# Nginx Configuration for legal.org.ua (Production)
# Runs as a Docker container (nginx-prod) in docker-compose.prod.yml

# Hide nginx version in error pages and Server header
server_tokens off;

# Sanitize JWT tokens from access logs
map $request_uri $sanitized_uri {
    "~^(?<prefix>.*)token=[^&]+(?<suffix>.*)$"  "${prefix}token=[REDACTED]${suffix}";
    default                                      $request_uri;
}
log_format sanitized '$remote_addr - $remote_user [$time_local] "$request_method $sanitized_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

# Rate limiting zones (must be in http context, before server blocks)
# Use X-Forwarded-For from Cloudflare/ALB as real client IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn_limit:10m;

# ==========================================
# Default server — reject requests by IP or unknown Host
# Blocks direct access to origin IP (bypassing Cloudflare)
# ==========================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    # Drop connection immediately — no response body
    return 444;
}

# App upstreams — managed by deploy script (blue-green switching)
include /etc/nginx/includes/prod-upstreams.conf;

# Preview upstreams — managed by deploy script (points to inactive color)
include /etc/nginx/includes/preview-upstreams.conf;

# Static upstreams
upstream prod_platform {
    server platform-prod:80;
    keepalive 16;
}

upstream prod_plane {
    server 172.18.0.1:8282;
    keepalive 16;
}

upstream prod_plane_mcp_docs {
    server plane-mcp-docs:80;
    keepalive 4;
}

upstream prod_plane_mcp {
    server plane-mcp:8211;
    keepalive 4;
}

upstream prod_plane_mcp_igor {
    server plane-mcp-igor:8211;
    keepalive 4;
}

# HTTP - plane.legal.org.ua (Plane project management)
server {
    listen 80;
    listen [::]:80;
    server_name plane.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB → proxy to Plane
    location / {
        proxy_pass http://prod_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100m;
    }
}

