# ---------------------------------------------------------------------------
# lawrider.ch — standalone unit, lives in /home/ubuntu/lawrider
# Origin cert: Cloudflare Origin CA, /etc/letsencrypt/lawrider.ch/ (valid to 2041)
# Upstream: container `lawrider-site` on the shared prod network
# Moving hosts: copy this block to the new edge, copy the cert, that is all.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name lawrider.ch www.lawrider.ch;
    return 301 https://lawrider.ch$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lawrider.ch;

    ssl_certificate /etc/letsencrypt/lawrider.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/lawrider.ch/privkey.pem;
    include /etc/nginx/includes/ssl-common.conf;

    return 301 https://lawrider.ch$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lawrider.ch;

    ssl_certificate /etc/letsencrypt/lawrider.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/lawrider.ch/privkey.pem;
    include /etc/nginx/includes/ssl-common.conf;

    access_log /var/log/nginx/lawrider.access.log;
    error_log  /var/log/nginx/lawrider.error.log;

    # resolve the upstream at request time so a restart of the site container
    # never wedges the edge
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $lawrider_site lawrider-site;

    location / {
        proxy_pass http://$lawrider_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
