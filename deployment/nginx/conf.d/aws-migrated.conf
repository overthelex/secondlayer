    }
}

# ---------- Agents (Gradio) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agents.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/agents-access.log;
    error_log /var/log/nginx/agents-error.log;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $lmaf_upstream http://lmaf-local:7860;
        proxy_pass $lmaf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------- Static sites ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opendata.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/opendata;
    index index.html;
    location ~ /\.(?!well-known) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(png|svg|jpg|ico|css|js)$ { expires 7d; add_header Cache-Control "public"; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name defectradar.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/defectradar;
    index index.html;
    location ~ /\.(?!well-known) { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(png|svg|jpg|ico|css|js)$ { expires 7d; add_header Cache-Control "public"; }
}
