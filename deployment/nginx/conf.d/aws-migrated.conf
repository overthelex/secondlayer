# Hosts moved from the AWS box (i-04e39a795576e33f0, decommissioned 09.2026)
# onto cthulhu. All names are proxied through Cloudflare, cert = Origin CA for
# legal.org.ua + *.legal.org.ua (deployment/nginx/certs/legal.org.ua.pem).
#
# Every upstream is a variable resolved through Docker DNS at request time, so
# nginx starts (and keeps serving legal.org.ua) even when one of these stacks
# is down — a literal proxy_pass to an absent container name is a startup error.
#
#   plane.legal.org.ua          → plane-proxy:80   (~/plane-selfhost/plane-app, alias on secondlayer-local)
#   plane-mcp.legal.org.ua      → plane-mcp:8211   (~/mcplane, SSE)
#   plane-mcp-doc.legal.org.ua  → plane-mcp-docs:80
#   grafana.legal.org.ua        → grafana-local:3000
#   opendata.legal.org.ua       → static, deployment/static/opendata
#   defectradar.legal.org.ua    → static, deployment/static/defectradar
#   agents.legal.org.ua         → lmaf-local:7860 (Gradio, websockets)

# ---------- Plane ----------
server {
    listen 80;
    listen [::]:80;
    server_name plane.legal.org.ua plane-mcp.legal.org.ua plane-mcp-doc.legal.org.ua grafana.legal.org.ua opendata.legal.org.ua defectradar.legal.org.ua agents.legal.org.ua;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plane.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/plane-access.log;
    error_log /var/log/nginx/plane-error.log;

    client_max_body_size 100m;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $plane_upstream http://plane-proxy:80;
        proxy_pass $plane_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ---------- Plane MCP (SSE) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plane-mcp.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/plane-mcp-access.log;
    error_log /var/log/nginx/plane-mcp-error.log;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $plane_mcp_upstream http://plane-mcp:8211;
        proxy_pass $plane_mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # long-lived SSE stream: no buffering, no idle timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plane-mcp-doc.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $plane_mcp_docs_upstream http://plane-mcp-docs:80;
        proxy_pass $plane_mcp_docs_upstream;
        proxy_set_header Host $host;
    }
}

# ---------- Grafana (public name; local.grafana.* stays in local-docker.conf) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.legal.org.ua;

    ssl_certificate /etc/nginx/certs/legal.org.ua.pem;
    ssl_certificate_key /etc/nginx/certs/legal.org.ua-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/grafana-access.log;
    error_log /var/log/nginx/grafana-error.log;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $grafana_pub_upstream http://grafana-local:3000;
        proxy_pass $grafana_pub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
