# Активные апстримы локального окружения — файл переписывает джоба деплоя
# при переключении цвета (blue-green). Руками не править: следующая выкатка
# перезапишет.
#
# Синий цвет: secondlayer-app-local / lexwebapp-local
# Зелёный:    secondlayer-app-local-green / lexwebapp-local-green

upstream local_mcp_backend {
    server secondlayer-app-local:3000;
    keepalive 128;
}

upstream local_frontend {
    server lexwebapp-local:80;
    keepalive 32;
}
