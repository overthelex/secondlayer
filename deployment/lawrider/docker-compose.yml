# Standalone unit for the lawrider.ch site.
# Self-contained on purpose: this directory is the whole deployment.
# Moving hosts = rsync this directory, drop the `edge` network below,
# `docker compose up -d`, repoint the A record, add one vhost to the new edge nginx.
services:
  lawrider-site:
    image: nginx:1.27-alpine
    container_name: lawrider-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  default:
  # the only coupling to the host's existing stack: lets the edge nginx
  # reach this container by name. Remove this when the edge changes.
  edge:
    external: true
    name: deployment_secondlayer-prod-network
