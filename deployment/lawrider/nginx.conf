server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # real files, and they must answer as files: the old catch-all fallback
    # served 46 KB of index.html under a 200 for /favicon.ico
    location = /favicon.ico { try_files $uri =404; expires 30d; access_log off; }
    location = /apple-touch-icon.png { try_files $uri =404; expires 30d; access_log off; }
    location = /apple-touch-icon-precomposed.png { try_files $uri =404; expires 30d; access_log off; }

    # one page, no client-side router: anything missing is missing, not the page
    location / {
        try_files $uri $uri/ =404;
    }

    # the page is one self-contained file; cache it briefly, revalidate often
    location = /index.html {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        # add_header in a location drops every inherited one, so the page itself
        # was the only response shipping without these three
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
