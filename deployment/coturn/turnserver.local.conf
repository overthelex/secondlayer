# coturn for legal.org.ua served from cthulhu (moved from AWS 09.2026).
# Same as turnserver.conf minus external-ip: the machine address is passed
# on the command line (--external-ip=${TURN_EXTERNAL_IP}) by docker-compose.local.yml,
# and the shared secret via --static-auth-secret.
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
realm=secondlayer.legal
min-port=49152
max-port=65535
total-quota=100
max-bps=10000000
stale-nonce=600
no-multicast-peers
no-cli
log-file=stdout
new-log-timestamp
verbose
