# Dev VM override — снижает resource limits для VM e2-standard-4 (4 CPU / 16 GB)
# Используется только на secondlayer-dev-vm (34.116.251.221)
# Запуск: docker compose -f docker-compose.local.yml -f docker-compose.dev-vm.yml --env-file .env.local up -d
services:
  postgres-local:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  qdrant-local:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  app-local:
    environment:
      # Прод-Qdrant (bigbox, 296M векторов) через WireGuard-туннель
      QDRANT_URL: http://10.88.0.1:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  rada-mcp-app-local:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  document-service-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  app-openreyestr-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  terminal-service-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  minio-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  lexwebapp-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  nginx-local:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M

  prometheus-local:
