# Internal edge for lawrider.ch on cthulhu.
# Reached only through the Cloudflare tunnel (cloudflared-lawrider), which
# forwards every lawrider hostname to http://lawrider-edge:80. TLS ends at
# Cloudflare, so there is no 443 here and no host port at all: nginx-local
# (legal.org.ua) keeps 80/443 to itself.
#
# lawrider.ch       -> static site container
# www.lawrider.ch   -> 301 to apex
# mcp.lawrider.ch   -> unified-gateway backend (ch_* MCP tools)
# check.lawrider.ch -> same as apex; rehearsal name used before DNS cutover
# lawrider.pl       -> same static site container (no Polish site yet)
# www.lawrider.pl   -> 301 to apex
# mcp.lawrider.pl   -> second backend instance, full tool registry (MCP_TOOLSET=all)
# attorney.lawrider.pl -> Polish attorney CRM (attorney-crm-pl:3020)

# Resolve upstreams at request time so recreating a backend container never
# wedges the edge.
resolver 127.0.0.11 valid=30s ipv6=off;

# Cloudflare sets the client address; keep the scheme the visitor used.
map $http_x_forwarded_proto $lawrider_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name www.lawrider.ch;
    return 301 https://lawrider.ch$request_uri;
}

server {
    listen 80;
    server_name lawrider.ch check.lawrider.ch;

    access_log /var/log/nginx/lawrider.access.log;
    error_log  /var/log/nginx/lawrider.error.log;

    set $lawrider_site lawrider-site;

    location / {
        proxy_pass http://$lawrider_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $lawrider_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name mcp.lawrider.ch;

    access_log /var/log/nginx/mcp-lawrider.access.log;
    error_log  /var/log/nginx/mcp-lawrider.error.log;

    client_max_body_size 50m;

    set $lawrider_app lawrider-app;

    location / {
        proxy_pass http://$lawrider_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $lawrider_proto;
        # SSE / streaming MCP responses
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

