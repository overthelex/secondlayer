# Edge nginx for the GCP lawrider box.
# lawrider.ch      -> static site container
# mcp.lawrider.ch  -> unified-gateway backend (ch_* / uk_* MCP tools)
#
# Cert: Cloudflare Origin CA for lawrider.ch + *.lawrider.ch (valid to 2041),
# mounted from /home/ubuntu/certs-lawrider.ch. Traffic is proxied by
# Cloudflare, so the origin cert never faces browsers directly.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Resolve upstreams at request time so a restart of a backend container
# never wedges the edge (same pattern as the AWS prod edge).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://lawrider.ch$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lawrider.ch;

    ssl_certificate /etc/nginx/certs/lawrider.ch/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.ch/privkey.pem;

    return 301 https://lawrider.ch$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lawrider.ch;

    ssl_certificate /etc/nginx/certs/lawrider.ch/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.ch/privkey.pem;

    access_log /var/log/nginx/lawrider.access.log;
    error_log  /var/log/nginx/lawrider.error.log;

    set $lawrider_site lawrider-site;

    location / {
        proxy_pass http://$lawrider_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.lawrider.ch;

    ssl_certificate /etc/nginx/certs/lawrider.ch/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.ch/privkey.pem;

    access_log /var/log/nginx/mcp-lawrider.access.log;
    error_log  /var/log/nginx/mcp-lawrider.error.log;

    client_max_body_size 50m;

    set $lawrider_app lawrider-app;

    location / {
        proxy_pass http://$lawrider_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / streaming MCP responses
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
