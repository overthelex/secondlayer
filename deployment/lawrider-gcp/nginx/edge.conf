# Edge nginx for the GCP lawrider box — the BRITISH product since 2026-09-18.
# lawrider.uk      -> static site container
# mcp.lawrider.uk  -> unified-gateway backend (uk_* MCP tools)
#
# The Swiss names are deliberately absent: lawrider.ch is served from cthulhu
# now (deployment/lawrider-cthulhu), and a box that still answered for it would
# make "which origin replied" a question nobody can answer from a response.
#
# Cert: Cloudflare Origin CA for lawrider.uk + *.lawrider.uk, issued 2026-09-19
# and valid to 2041-09-15, mounted from /home/ubuntu/certs-lawrider.uk. The zone
# can therefore be set to Full (strict); until 2026-09-19 this box presented the
# lawrider.ch cert, which worked only because Cloudflare was in Full and never
# checked the name.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# Phones are kept out of the team area: it is meant for a laptop, desktop or
# iPad. Tablets pass (iPad, and Android without "Mobile"; iPadOS also sends a
# Mac user agent). A phone asking for "desktop site" gets through; this is a
# policy, not a security boundary, and the password still is one.
map $http_user_agent $lr_phone {
    default 0;
    "~*(iPhone|iPod)" 1;
    "~*Android.*Mobile" 1;
    "~*(Windows Phone|IEMobile|BlackBerry|BB10|Opera Mini|Mobile.*Firefox)" 1;
}
map "$lr_phone:$request_method" $lr_phone_post {
    default 0;
    "1:POST" 1;
}

# Resolve upstreams at request time so a restart of a backend container
# never wedges the edge (same pattern as the AWS prod edge).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 301 https://lawrider.uk$request_uri;
    }
}

# Unknown Host over TLS. Without this the FIRST 443 block becomes nginx's default,
# so a request for lawrider.ch — during a rollback, from a stale Cloudflare record,
# from a scanner — would be answered here and 301'd to lawrider.uk. Refusing it
# keeps "which origin served this" answerable from the response alone.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/lawrider.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.uk/privkey.pem;

    return 421;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lawrider.uk;

    ssl_certificate /etc/nginx/certs/lawrider.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.uk/privkey.pem;

    return 301 https://lawrider.uk$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lawrider.uk;

    ssl_certificate /etc/nginx/certs/lawrider.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.uk/privkey.pem;

    access_log /var/log/nginx/lawrider.access.log;
    error_log  /var/log/nginx/lawrider.error.log;

    set $lawrider_site lawrider-site;
    set $lawrider_sell_auth lawrider-sell-auth;
    set $lawrider_teamarea_api lawrider-teamarea-api;

    # --- Team area: /teamarea is served only after lawrider-sell-auth
    # (oauth2-proxy, htpasswd on the box) accepts the session cookie. Anonymous
    # requests are sent to the branded sign-in page with rd= pointing back.
    location ^~ /teamarea {
        # From a phone: the sign-in page, which there shows the "use a laptop,
        # desktop or iPad" notice instead of the form.
        if ($lr_phone) { return 302 /oauth2/sign_in; }
        auth_request /teamarea-authz;
        error_page 401 = @teamarea_signin;
        # A page an admin has hidden from this person: back to the team area
        # start, which forwards to the first page they can see.
        error_page 403 = @teamarea_forbidden;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://$lawrider_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Profile API. Same gate, but a missing session is a plain 401 for the
    # page's fetch() rather than a redirect. The signed-in email comes from
    # oauth2-proxy (--set-xauthrequest) and overwrites any X-Team-Email the
    # browser sent, so the API can trust it. It is X-Auth-Request-User, not
    # -Email: an htpasswd session carries the login (our logins are emails) in
    # "user" and leaves "email" empty.
    location ^~ /teamarea/api/ {
        if ($lr_phone) { return 403; }
        auth_request /teamarea-authz;
        auth_request_set $team_email $upstream_http_x_auth_request_user;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Photos (cropped JPEG, ~100 KB); teamarea-api caps each endpoint itself.
        client_max_body_size 3m;
        proxy_pass http://$lawrider_teamarea_api:8080;
        proxy_set_header X-Team-Email $team_email;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @teamarea_forbidden {
        return 302 /teamarea/;
    }

    # Every team page and API call is checked by teamarea-api: it validates the
    # session with sell-auth and applies the per-page access rules, answering
    # 202 (+ X-Auth-Request-User), 401 or 403. The subrequest inherits the
    # browser's cookies; the body is not sent, but its size is checked against
    # this location's limit, hence 3m for photo uploads.
    location = /teamarea-authz {
        internal;
        client_max_body_size 3m;
        proxy_pass http://$lawrider_teamarea_api:8080/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
    }

    location @teamarea_signin {
        return 302 /oauth2/sign_in?rd=$request_uri;
    }

    # The team area lived at /sell until 2026-09-28; old links land on its
    # sales page. Nothing is served from /sell any more.
    location ^~ /sell {
        return 301 /teamarea/sales/;
    }

    location = /oauth2/auth {
        internal;
        # The subrequest checks the parent's body size against this location's
        # limit (default 1m) and turns a big photo upload into a 500. Match
        # the largest limit under /teamarea/.
        client_max_body_size 3m;
        proxy_pass http://$lawrider_sell_auth:4180;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }

    # Only the htpasswd form is a valid way in; the placeholder OAuth provider
    # flow must never start.
    location ^~ /oauth2/start { return 404; }
    location ^~ /oauth2/callback { return 404; }

    # A sign-in posted from a phone is not passed on: back to the page, which
    # shows the notice. Signing in by other means from a phone still would not
    # open /teamarea, which sends phones here.
    location = /oauth2/sign_in {
        if ($lr_phone_post) { return 303 /oauth2/sign_in; }
        proxy_pass http://$lawrider_sell_auth:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /oauth2/ {
        proxy_pass http://$lawrider_sell_auth:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://$lawrider_site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.lawrider.uk;

    ssl_certificate /etc/nginx/certs/lawrider.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/lawrider.uk/privkey.pem;

    access_log /var/log/nginx/mcp-lawrider.access.log;
    error_log  /var/log/nginx/mcp-lawrider.error.log;

    client_max_body_size 50m;

    set $lawrider_app lawrider-app;

    # Principle 7 of the Find Case Law licence (TNA CAS-349914-B9P5B8): no judgment
    # content on search engines, and crawling of record-bearing routes disallowed.
    # This host is an API (MCP, OAuth, REST), with nothing on it a search engine should
    # list, so every path is disallowed and every response says noindex. On this host
    # the app's own X-Robots-Tag covers /api only, and /v2/mcp (which carries
    # uk_search_judgments) is outside it: the header below is the ONLY one /v2/mcp gets.
    # Do not remove it on the belief that the app sets it.
    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_hide_header X-Robots-Tag;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        proxy_pass http://$lawrider_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / streaming MCP responses
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
