# lawrider.uk stack on GCP (lawrider-gcp VM, europe-west6-a).
# Serves: the static site + the unified-gateway MCP API (uk_* tools only) on
# mcp.lawrider.uk, backed by the UK corpus — 238,926 acts, 1.78M provisions of
# current text, 1.64M point-in-time intervals, 1.21M amendments.
#
# ⚠ This box used to be lawrider.ch. The Swiss product moved to cthulhu on
# 2026-09-18 (deployment/lawrider-cthulhu, PR #2433): its stack, its crons and
# its Cloudflare tunnel all run there now, and the GCP crontab holds nothing but
# the UK refresh. What is left here is the British product, so this file stopped
# describing the Swiss one.
#
# The ch_* tables are still on disk, deliberately: cheap to keep, expensive to
# rebuild, and the fastest rollback if the cthulhu move has to be undone. The
# Swiss VECTORS are not — /data/qdrant did not exist on this box on 2026-09-22,
# whatever the earlier note claimed, and that directory now holds the UK index.
#
# Deployed by .github/workflows/deploy-lawrider-uk.yml.
# Env file lives on the box at /home/ubuntu/SecondLayer/deployment/.env.prod
# (same layout as the AWS prod box; rsync during deploy excludes it).
#
# Host paths:
#   /data/pg                      postgres data
#   /data/redis                   redis data
#   /data/uk                      bulk archives + refresh state (see overthelex/lawrider-uk)
#   /data/qdrant                  uk_provisions_bge, 6.7G (the CH collection this
#                                 line used to name was not on the box)
#   /data/tei-cache               bge-m3 ONNX weights, ~2.2G
#   /home/ubuntu/lawrider/site    static site
#   /home/ubuntu/certs-lawrider.uk  Cloudflare Origin CA cert for lawrider.uk +
#     *.lawrider.uk, issued 2026-09-19, valid to 2041-09-15. fullchain.pem +
#     privkey.pem, key generated on the box and never copied off it.

name: lawrider

services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-lawrider
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      postgres -c shared_buffers=8GB -c effective_cache_size=22GB
      -c maintenance_work_mem=2GB -c max_wal_size=8GB
      -c wal_compression=on -c work_mem=64MB
      -c max_connections=200
    volumes:
      - /data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
      # 5438 was the port ch-pipeline's run-delta.sh expected, inherited from
      # AWS prod. That cron lives on cthulhu now, but the port stays: the UK
      # refresh reads its DSN from /data/uk/db.env, which points here.
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lawrider]

  redis:
    image: redis:7-alpine
    container_name: redis-lawrider
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [lawrider]

  migrate:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.mono-backend
    image: lawrider-app:latest
    container_name: lawrider-migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/London
      # This box carries British law and UK court decisions, and builds its own
      # schema from that set rather than from a dump of another box — 134 of the
      # 220 migrations. See mcp_backend/src/migrations/sets/uk.txt for how the
      # list was chosen and what it deliberately leaves out.
      #
      # ⚠ Without this the run stops at 126_spain_legal_data.sql, which ALTERs
      # tables no migration creates: a fresh database cannot be built from the
      # full history at all.
      MIGRATION_SET: uk
    working_dir: /app/mcp_backend
    command: ["node", "dist/migrations/migrate.js"]
    restart: "no"
    networks: [lawrider]

  app:
    image: lawrider-app:latest
    container_name: lawrider-app
    command: ["node", "--max-old-space-size=4096", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # LLM providers (same keys as AWS prod; needed by consult/summarise paths)
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-bedrock-first}
      AWS_ACCESS_KEY_ID: ${BACKEND_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKEND_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_QUICK: ${BEDROCK_MODEL_QUICK:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MODEL_STANDARD: ${BEDROCK_MODEL_STANDARD:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_DEEP: ${BEDROCK_MODEL_DEEP:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_FALLBACK_MODEL_QUICK: ${BEDROCK_FALLBACK_MODEL_QUICK:-eu.amazon.nova-micro-v1:0}
      BEDROCK_FALLBACK_MODEL_STANDARD: ${BEDROCK_FALLBACK_MODEL_STANDARD:-eu.amazon.nova-pro-v1:0}
      BEDROCK_FALLBACK_MODEL_DEEP: ${BEDROCK_FALLBACK_MODEL_DEEP:-eu.amazon.nova-pro-v1:0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Unified gateway: uk_* tools are served locally from Postgres.
      # RADA / OpenReyestr / Qdrant / Neo4j / MinIO / document-service stay on
      # the UA prod — leave their endpoints unset here so those tools fail
      # closed instead of hitting a wrong host.
      ENABLE_UNIFIED_GATEWAY: "true"
      CITATION_BACKEND: ${CITATION_BACKEND:-postgres}
      # UK only (see mcp_backend/src/api/mcp-toolset.ts). The Swiss tools answer from
      # cthulhu now and the Ukrainian ones from legal.org.ua; one box, one corpus, and
      # a typo in this value serves nothing rather than the wrong jurisdiction.
      #
      # ⚠ uk_court_decisions (Find Case Law) is reached only through uk_search_judgments
      # and search_registry(registry=uk_court_decisions), and only by users granted in uk_judgment_access (verified, 12-month expiry, every
      # call logged): services/uk-judgment-access.ts. The licence was approved on 24.09.2026
      # and is not yet signed; until it is, no vectors or LLM work over judgments
      # (LEXAI-2056).
      MCP_TOOLSET: "uk"
      # New billing accounts are GBP; the uk_* tools carry fixed GBP prices (migration 223).
      BILLING_DEFAULT_CURRENCY: "GBP"
      # mcp.lawrider.uk proxies / straight to the app (no /api prefix), so the OAuth
      # protected-resource metadata must name https://mcp.lawrider.uk/v2/mcp.
      MCP_PUBLIC_PATH_PREFIX: ""
      # OAuth sign-in page: LawRider, in English (default is the legal.org.ua page).
      OAUTH_BRAND: "lawrider"

      # Vector search over the statute book (uk_semantic_search). These were
      # deliberately absent while the only vector-backed tool in the image was
      # ch_semantic_search, which this box no longer serves; there is now a UK
      # one, and the two containers below answer it.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant-uk:6333}
      BGE_M3_URL: ${BGE_M3_URL:-http://tei-bge-uk:80}
      UK_BGE_COLLECTION: ${UK_BGE_COLLECTION:-uk_provisions_bge}

      # Identity of this deployment
      PUBLIC_URL: https://lawrider.uk
      FRONTEND_URL: https://lawrider.uk
      ALLOWED_ORIGINS: https://lawrider.uk,https://mcp.lawrider.uk
      WEBAUTHN_RP_ID: lawrider.uk
      WEBAUTHN_RP_NAME: LawRider
      WEBAUTHN_ORIGIN: https://lawrider.uk

      MOCK_PAYMENTS: "true"
      UPLOAD_TEMP_DIR: /app/data/uploads
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_TO_FILE: "false"
      TZ: Europe/London
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 6G
    networks: [lawrider]

  # ⚠ Correction to the note that stood here: it said /data/qdrant still held the
  # 22.3M-point ch_corpus_bge_cls collection as a cheap rollback. It did not. The
  # directory was absent from this box on 2026-09-22 — measured, `du -sh /data/*`
  # listed only pg, redis and uk — so the Swiss vectors went with the move and a
  # rollback plan resting on them would have failed at the moment it was needed.
  #
  # These two are back because the UK corpus now has its own vectors: 1,326,013
  # bge-m3 points over 1,237,129 distinct provision wordings, embedded on
  # SageMaker (scripts/legislation/sagemaker/launch_fleet.py --corpus
  # uk-provisions). Both are sized for a box that also runs Postgres with 8G of
  # shared buffers, which is why they are a fraction of what the Swiss pair took.

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant-uk
    restart: unless-stopped
    # Vectors live on disk; int8 quantization keeps ~1.4G of them in RAM, and
    # rescoring reads the originals only for the shortlist.
    mem_limit: 4g
    ports:
      # 6334 is not optional. Loading over REST means a 25 MB JSON body per
      # 2,000 points: the first attempt landed nothing in five minutes with
      # Qdrant idle at 0.2% CPU. Over gRPC the same 1.33M points took ~20.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - /data/qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [lawrider]

  tei:
    # ⚠ cpu-1.5 cannot fetch the model at all ("relative URL without a base").
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: tei-bge-uk
    restart: unless-stopped
    # ⚠ --pooling cls, matching what the SageMaker entry script used to build the
    # index. A mean-pooled query against a CLS index raises no error and simply
    # returns worse neighbours, which is the hardest kind of bug to notice.
    #
    # The token window is deliberately small: this serves single queries, and at
    # the default 8192 the container crash-looped through warmup on this box.
    command: >-
      --model-id BAAI/bge-m3 --pooling cls
      --max-batch-tokens 2048 --max-client-batch-size 4
      --max-concurrent-requests 8 --auto-truncate
    mem_limit: 4g
    volumes:
      - /data/tei-cache:/data
    # Worth having because the failure it catches is silent: if the model does not
    # come down, TEI answers connection refused, BgeM3Client does not retry that
    # (only 429 and 503), and the deploy reports success while the tool errors.
    #
    # ⚠ Deliberately NOT a `depends_on: condition: service_healthy` on app. Tying the
    # app's start to this would take the other five UK tools down whenever the
    # embedder is unwell, which trades a broken tool for a broken deployment.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    networks: [lawrider]

  site:
    image: nginx:1.27-alpine
    container_name: lawrider-site
    restart: unless-stopped
    volumes:
      - /home/ubuntu/lawrider/site:/usr/share/nginx/html:ro
    networks: [lawrider]

  # Password-protected team pages under lawrider.uk/teamarea. The edge asks this
  # service (auth_request) before serving /teamarea; it renders the branded sign-in
  # page from ./sell-auth/templates and checks credentials against a bcrypt
  # htpasswd file kept ON THE BOX, outside git and outside the served site dir:
  # /home/ubuntu/lawrider/htpasswd/sell. The Google provider flags are inert
  # placeholders (oauth2-proxy needs a provider); the edge 404s /oauth2/start so
  # only the htpasswd form can be used.
  sell-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    container_name: lawrider-sell-auth
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --provider=google
      - --client-id=unused
      - --client-secret=unused
      - --htpasswd-file=/htpasswd/sell
      - --display-htpasswd-form=true
      - --email-domain=*
      - --cookie-name=_lr_team
      - --cookie-secure=true
      - --cookie-expire=168h
      - --upstream=static://202
      - --custom-templates-dir=/templates
      - --reverse-proxy=true
      - --redirect-url=https://lawrider.uk/oauth2/callback
      - --whitelist-domain=lawrider.uk
      # X-Auth-Request-User on /oauth2/auth: the edge hands it to teamarea-api
      # as the only statement of who is signed in.
      - --set-xauthrequest=true
    environment:
      OAUTH2_PROXY_COOKIE_SECRET: ${SELL_AUTH_COOKIE_SECRET:?SELL_AUTH_COOKIE_SECRET missing from .env.prod}
    volumes:
      - /home/ubuntu/lawrider/htpasswd:/htpasswd:ro
      - ./sell-auth/templates:/templates:ro
    networks: [lawrider]

  # Profiles for lawrider.uk/teamarea/profile/. Reached only through the edge
  # after auth_request; identity is the X-Team-Email the edge sets.
  teamarea-api:
    build: ./teamarea-api
    image: lawrider-teamarea-api:local
    container_name: lawrider-teamarea-api
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATA_DIR: /data
      HTPASSWD_FILE: /htpasswd/sell
      # The edge's auth_request for team pages comes to teamarea-api, which
      # asks sell-auth whether the session is valid, then applies access rules.
      AUTH_URL: http://lawrider-sell-auth:4180/oauth2/auth
      # See everything, edit who sees which page, read the activity log.
      ADMIN_EMAILS: vladimir@lawrider.uk
    volumes:
      # Profiles. A fresh volume (not teamarea_data): an empty named volume
      # takes /data's node ownership from the image only on first use, and
      # teamarea_data was first created root-owned.
      - teamarea_profiles:/data
      # Read-write here so people can change their own password; sell-auth
      # mounts the same directory read-only and re-reads the file on change.
      - /home/ubuntu/lawrider/htpasswd:/htpasswd
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [lawrider]

  edge:
    image: nginx:1.27-alpine
    container_name: lawrider-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/certs-lawrider.uk:/etc/nginx/certs/lawrider.uk:ro
    depends_on:
      - site
      - sell-auth
      - teamarea-api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [lawrider]

volumes:
  app_data:
  teamarea_profiles:

networks:
  lawrider:
    name: lawrider
