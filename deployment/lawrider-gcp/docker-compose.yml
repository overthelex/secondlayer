# lawrider.ch stack on GCP (lawrider-gcp VM, europe-west6-a).
# Serves: the static lawrider.ch site + the unified-gateway MCP API
# (ch_* / uk_* tools) on mcp.lawrider.ch, backed by a Postgres subset
# (full schema, data for uk_*/ch_* + service tables only).
#
# Deployed by .github/workflows/deploy-lawrider-gcp.yml.
# Env file lives on the box at /home/ubuntu/SecondLayer/deployment/.env.prod
# (same layout as the AWS prod box; rsync during deploy excludes it).
#
# Host paths:
#   /data/pg                      postgres data
#   /data/redis                   redis data
#   /data/qdrant                  qdrant vector storage (CH corpus)
#   /home/ubuntu/lawrider/site    static site (rsynced from AWS)
#   /home/ubuntu/certs-lawrider.ch  Cloudflare Origin CA cert (*.lawrider.ch)

name: lawrider

services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-lawrider
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      postgres -c shared_buffers=8GB -c effective_cache_size=22GB
      -c maintenance_work_mem=2GB -c max_wal_size=8GB
      -c wal_compression=on -c work_mem=64MB
      -c max_connections=200
    volumes:
      - /data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
      # ch-pipeline's run-delta.sh builds its DSN with the host port 5438
      # (the mapping AWS prod used); expose the same port so the cron
      # scripts run unmodified on this box.
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lawrider]

  redis:
    image: redis:7-alpine
    container_name: redis-lawrider
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [lawrider]

  migrate:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.mono-backend
    image: lawrider-app:latest
    container_name: lawrider-migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Zurich
    working_dir: /app/mcp_backend
    command: ["node", "dist/migrations/migrate.js"]
    restart: "no"
    networks: [lawrider]

  app:
    image: lawrider-app:latest
    container_name: lawrider-app
    command: ["node", "--max-old-space-size=4096", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # LLM providers (same keys as AWS prod; needed by consult/summarise paths)
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-bedrock-first}
      AWS_ACCESS_KEY_ID: ${BACKEND_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKEND_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_QUICK: ${BEDROCK_MODEL_QUICK:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MODEL_STANDARD: ${BEDROCK_MODEL_STANDARD:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_DEEP: ${BEDROCK_MODEL_DEEP:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_FALLBACK_MODEL_QUICK: ${BEDROCK_FALLBACK_MODEL_QUICK:-eu.amazon.nova-micro-v1:0}
      BEDROCK_FALLBACK_MODEL_STANDARD: ${BEDROCK_FALLBACK_MODEL_STANDARD:-eu.amazon.nova-pro-v1:0}
      BEDROCK_FALLBACK_MODEL_DEEP: ${BEDROCK_FALLBACK_MODEL_DEEP:-eu.amazon.nova-pro-v1:0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Unified gateway: ch_* / uk_* tools are served locally from Postgres.
      # RADA / OpenReyestr / Qdrant / Neo4j / MinIO / document-service stay on
      # the UA prod — leave their endpoints unset here so those tools fail
      # closed instead of hitting a wrong host.
      ENABLE_UNIFIED_GATEWAY: "true"
      CITATION_BACKEND: ${CITATION_BACKEND:-postgres}

      # Identity of this deployment
      PUBLIC_URL: https://lawrider.ch
      FRONTEND_URL: https://lawrider.ch
      ALLOWED_ORIGINS: https://lawrider.ch,https://mcp.lawrider.ch
      WEBAUTHN_RP_ID: lawrider.ch
      WEBAUTHN_RP_NAME: LawRider
      WEBAUTHN_ORIGIN: https://lawrider.ch

      MOCK_PAYMENTS: "true"
      UPLOAD_TEMP_DIR: /app/data/uploads
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_TO_FILE: "false"
      TZ: Europe/Zurich
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 6G
    networks: [lawrider]

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: qdrant-lawrider
    restart: unless-stopped
    # Vector store for the CH corpus (decisions + legislation, bge-m3 CLS).
    # Loaded by the embedding pipeline; the app is NOT pointed here yet —
    # QDRANT_URL stays unset on `app` until the collections exist, so the
    # qdrant-backed tools keep failing closed instead of querying an empty
    # instance.
    volumes:
      - /data/qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
    networks: [lawrider]

  site:
    image: nginx:1.27-alpine
    container_name: lawrider-site
    restart: unless-stopped
    volumes:
      - /home/ubuntu/lawrider/site:/usr/share/nginx/html:ro
    networks: [lawrider]

  edge:
    image: nginx:1.27-alpine
    container_name: lawrider-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/certs-lawrider.ch:/etc/nginx/certs/lawrider.ch:ro
    depends_on:
      - site
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [lawrider]

volumes:
  app_data:

networks:
  lawrider:
    name: lawrider
