# lawrider.uk stack on GCP (lawrider-gcp VM, europe-west6-a).
# Serves: the static site + the unified-gateway MCP API (uk_* tools only) on
# mcp.lawrider.uk, backed by the UK corpus — 238,926 acts, 1.78M provisions of
# current text, 1.64M point-in-time intervals, 1.21M amendments.
#
# ⚠ This box used to be lawrider.ch. The Swiss product moved to cthulhu on
# 2026-09-18 (deployment/lawrider-cthulhu, PR #2433): its stack, its crons and
# its Cloudflare tunnel all run there now, and the GCP crontab holds nothing but
# the UK refresh. What is left here is the British product, so this file stopped
# describing the Swiss one.
#
# The ch_* tables and /data/qdrant are still on disk, deliberately: the data is
# cheap to keep and expensive to rebuild, and it is the fastest rollback if the
# cthulhu move has to be undone. Nothing here starts a container against it.
#
# Deployed by .github/workflows/deploy-lawrider-uk.yml.
# Env file lives on the box at /home/ubuntu/SecondLayer/deployment/.env.prod
# (same layout as the AWS prod box; rsync during deploy excludes it).
#
# Host paths:
#   /data/pg                      postgres data
#   /data/redis                   redis data
#   /data/uk                      bulk archives + refresh state (see scripts/uk)
#   /data/qdrant                  CH vectors, kept but no longer served here
#   /home/ubuntu/lawrider/site    static site
#   /home/ubuntu/certs-lawrider.uk  Cloudflare Origin CA cert for lawrider.uk +
#     *.lawrider.uk, issued 2026-09-19, valid to 2041-09-15. fullchain.pem +
#     privkey.pem, key generated on the box and never copied off it.

name: lawrider

services:
  postgres:
    image: postgres:15-alpine
    container_name: pg-lawrider
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >-
      postgres -c shared_buffers=8GB -c effective_cache_size=22GB
      -c maintenance_work_mem=2GB -c max_wal_size=8GB
      -c wal_compression=on -c work_mem=64MB
      -c max_connections=200
    volumes:
      - /data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
      # 5438 was the port ch-pipeline's run-delta.sh expected, inherited from
      # AWS prod. That cron lives on cthulhu now, but the port stays: the UK
      # refresh reads its DSN from /data/uk/db.env, which points here.
      - "127.0.0.1:5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [lawrider]

  redis:
    image: redis:7-alpine
    container_name: redis-lawrider
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [lawrider]

  migrate:
    build:
      context: ../..
      dockerfile: deployment/Dockerfile.mono-backend
    image: lawrider-app:latest
    container_name: lawrider-migrate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Zurich
    working_dir: /app/mcp_backend
    command: ["node", "dist/migrations/migrate.js"]
    restart: "no"
    networks: [lawrider]

  app:
    image: lawrider-app:latest
    container_name: lawrider-app
    command: ["node", "--max-old-space-size=4096", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HTTP_PORT: 3000
      HTTP_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # LLM providers (same keys as AWS prod; needed by consult/summarise paths)
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-bedrock-first}
      AWS_ACCESS_KEY_ID: ${BACKEND_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BACKEND_AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_QUICK: ${BEDROCK_MODEL_QUICK:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MODEL_STANDARD: ${BEDROCK_MODEL_STANDARD:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_DEEP: ${BEDROCK_MODEL_DEEP:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_FALLBACK_MODEL_QUICK: ${BEDROCK_FALLBACK_MODEL_QUICK:-eu.amazon.nova-micro-v1:0}
      BEDROCK_FALLBACK_MODEL_STANDARD: ${BEDROCK_FALLBACK_MODEL_STANDARD:-eu.amazon.nova-pro-v1:0}
      BEDROCK_FALLBACK_MODEL_DEEP: ${BEDROCK_FALLBACK_MODEL_DEEP:-eu.amazon.nova-pro-v1:0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Unified gateway: uk_* tools are served locally from Postgres.
      # RADA / OpenReyestr / Qdrant / Neo4j / MinIO / document-service stay on
      # the UA prod — leave their endpoints unset here so those tools fail
      # closed instead of hitting a wrong host.
      ENABLE_UNIFIED_GATEWAY: "true"
      CITATION_BACKEND: ${CITATION_BACKEND:-postgres}
      # UK only (see mcp_backend/src/api/mcp-toolset.ts). The Swiss tools answer from
      # cthulhu now and the Ukrainian ones from legal.org.ua; one box, one corpus, and
      # a typo in this value serves nothing rather than the wrong jurisdiction.
      #
      # ⚠ This does NOT open up uk_court_decisions. Those judgments are under the Find
      # Case Law licence, whose application is still undecided, and they have no tool at
      # all until it is — see services/uk-judgment-access.ts and LEXAI-2056.
      MCP_TOOLSET: "uk"

      # No QDRANT_URL / BGE_M3_URL on purpose: the only vector-backed tool this
      # image knows is ch_semantic_search, the toolset gate no longer admits it,
      # and an endpoint pointing at a container that is not running would turn a
      # clean "tool not available" into a connection error.

      # Identity of this deployment
      PUBLIC_URL: https://lawrider.uk
      FRONTEND_URL: https://lawrider.uk
      ALLOWED_ORIGINS: https://lawrider.uk,https://mcp.lawrider.uk
      WEBAUTHN_RP_ID: lawrider.uk
      WEBAUTHN_RP_NAME: LawRider
      WEBAUTHN_ORIGIN: https://lawrider.uk

      MOCK_PAYMENTS: "true"
      UPLOAD_TEMP_DIR: /app/data/uploads
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-info}
      LOG_TO_FILE: "false"
      TZ: Europe/Zurich
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 6G
    networks: [lawrider]

  # ⚠ qdrant and tei-bge-m3 used to live here. They served ch_semantic_search,
  # which is a Swiss tool and now answers from cthulhu, so keeping them running
  # cost 14G + 10G of memory limits and three CPUs for a corpus nobody queried
  # on this box. The containers are gone; /data/qdrant is NOT — the 22.3M-point
  # ch_corpus_bge_cls collection stays on disk as the cheap rollback. Restoring
  # them is git history plus `compose up`, and needs no re-embedding.

  site:
    image: nginx:1.27-alpine
    container_name: lawrider-site
    restart: unless-stopped
    volumes:
      - /home/ubuntu/lawrider/site:/usr/share/nginx/html:ro
    networks: [lawrider]

  edge:
    image: nginx:1.27-alpine
    container_name: lawrider-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/certs-lawrider.uk:/etc/nginx/certs/lawrider.uk:ro
    depends_on:
      - site
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [lawrider]

volumes:
  app_data:

networks:
  lawrider:
    name: lawrider
